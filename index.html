  // ==================== INTERAZIONE ====================
  // Due modalità, entrambe senza zoom della schermata:
  // 1) Trascina la tessera dal rack e rilasciala sulla cella desiderata.
  // 2) Tocca la tessera per "armarla", poi tocca la cella dove piazzarla.

  function clearSelection() {
    selectedTileIndex = -1;
  }

  // Si possono piazzare/spostare/ritirare tessere (bozza) anche quando è il turno dell'avversario
  // o della CPU, per provare le combinazioni: solo l'invio resta riservato al proprio turno.
  // Durante l'invio online (turn 'player' + isCpuThinking) resta tutto bloccato.
  function canEditDraft() {
    if (gameOver) return false;
    if (turn === 'player') return !isCpuThinking;
    return turn === 'cpu' || turn === 'opponent';
  }

  // Quando l'altro invia una parola, tutte le tessere di prova tornano in mano (il jolly torna ★).
  function recallDraftAfterOpponentWord() {
    const n = pendingTiles.length;
    for (const t of pendingTiles) playerRack.push(t.isBlank ? '★' : t.letter);
    pendingTiles = [];
    return n;
  }

  function toggleSelectTile(index) {
    if (!canEditDraft()) return;
    selectedTileIndex = (selectedTileIndex === index) ? -1 : index;
    renderRack();
    if (selectedTileIndex !== -1) {
      showNotification(`Lettera "${playerRack[selectedTileIndex]}" selezionata: tocca una cella.`, 1500);
    }
  }

  function placeTileAt(row, col, rackIndex) {
    if (!canEditDraft()) return;
    if (board[row][col] !== null) { showNotification('Cella già occupata!', 1200); return; }
    if (pendingTiles.some(t => t.row === row && t.col === col)) return;
    if (rackIndex < 0 || rackIndex >= playerRack.length) return;

    const letter = playerRack[rackIndex];

    // Tessera vuota (jolly): chiedi quale lettera rappresenta prima di piazzarla.
    // Vale 0 punti: la memorizziamo in minuscolo così LETTER_VALUES non la conteggia.
    if (letter === '★') {
      openBlankLetterPicker((chosen) => {
        if (!chosen) return;
        if (rackIndex >= playerRack.length || playerRack[rackIndex] !== '★') return;
        playerRack.splice(rackIndex, 1);
        pendingTiles.push({ row, col, letter: chosen.toLowerCase(), isBlank: true });
        popKey = row + ',' + col; haptic(12);
        clearSelection();
        renderRack();
        renderBoard();
        syncUI();
      });
      return;
    }

    playerRack.splice(rackIndex, 1);
    pendingTiles.push({ row, col, letter, isBlank: false });
    popKey = row + ',' + col; haptic(12);
    clearSelection();
    renderRack();
    renderBoard();
    syncUI();
  }

  // Toglie dalla board una tessera pending in (row,col) e la rimette nel rack.
  // Ritorna true se c'era davvero una tessera da richiamare.
  function recallPendingTileAt(row, col) {
    const pendIdx = pendingTiles.findIndex(t => t.row === row && t.col === col);
    if (pendIdx === -1) return false;
    const tile = pendingTiles[pendIdx];

    // La tessera vuota (jolly) può cambiare lettera in qualsiasi momento finché non
    // hai confermato la mossa: toccandola di nuovo si riapre la scelta, invece di
    // ritirarla in mano.
    if (tile.isBlank) {
      openBlankLetterPicker((chosen) => {
        if (chosen === 'RECALL') { returnPendingToRack(row, col); return; }
        if (!chosen) return;
        const stillIdx = pendingTiles.findIndex(t => t.row === row && t.col === col);
        if (stillIdx === -1) return;
        pendingTiles[stillIdx].letter = chosen.toLowerCase();
        renderBoard();
        syncUI();
      }, true);
      return true;
    }

    returnPendingToRack(row, col);
    return true;
  }

  // Rimette in mano una tessera piazzata (il jolly torna ★, libero di cambiare lettera).
  function returnPendingToRack(row, col) {
    const idx = pendingTiles.findIndex(t => t.row === row && t.col === col);
    if (idx === -1) return;
    const [tile] = pendingTiles.splice(idx, 1);
    playerRack.push(tile.isBlank ? '★' : tile.letter);
    renderRack();
    renderBoard();
    syncUI();
  }

  function handleCellClick(row, col) {
    if (!canEditDraft()) return;
    // Subito dopo un trascinamento sulla board arriva anche un "click" fantasma
    // sullo stesso tocco: lo ignoriamo perché l'azione è già stata gestita.
    if (Date.now() - lastBoardDragEndAt < 300) return;

    // Tocca (senza trascinare) una tessera già piazzata in questo turno: la riprendi in mano
    if (recallPendingTileAt(row, col)) return;

    if (board[row][col] !== null) {
      showNotification('Cella già occupata!', 1200);
      return;
    }

    if (selectedTileIndex !== -1) {
      placeTileAt(row, col, selectedTileIndex);
    } else {
      showNotification('Trascina una lettera qui, oppure toccala prima nel rack.', 1800);
    }
  }

  function recallAll() {
    if (pendingTiles.length === 0) return;
    for (const t of pendingTiles) playerRack.push(t.isBlank ? '★' : t.letter);
    pendingTiles = [];
    clearSelection();
    renderRack();
    renderBoard();
    syncUI();
    showNotification('Lettere ritirate.', 1000);
  }

  // ---------- CAMBIO TESSERE ----------
  function toggleSwapMode() {
    if (turn !== 'player' || gameOver || isCpuThinking) return;
    if (!swapMode) {
      if (pendingTiles.length > 0) recallAll();
      swapMode = true;
      swapSelection = [];
      clearSelection();
      playBtn.style.display = 'none';
      recallBtn.style.display = 'none';
      shuffleBtnEl.style.display = 'none';
      bagBtn.style.display = 'none';
      confirmSwapBtn.style.display = 'block';
      swapCloseBtn.style.display = 'flex';
      renderRack();
      showNotification('Tocca le lettere da cambiare, poi conferma.', 2200);
      syncUI();
    } else {
      exitSwapMode();
    }
  }

  function exitSwapMode() {
    swapMode = false;
    swapSelection = [];
    playBtn.style.display = '';
    recallBtn.style.display = '';
    shuffleBtnEl.style.display = '';
    bagBtn.style.display = '';
    confirmSwapBtn.style.display = 'none';
    swapCloseBtn.style.display = 'none';
    renderRack();
    syncUI();
  }

  function toggleSwapSelection(index) {
    const pos = swapSelection.indexOf(index);
    if (pos === -1) swapSelection.push(index);
    else swapSelection.splice(pos, 1);
  }

  function confirmSwap() {
    if (swapSelection.length === 0) {
      showNotification('Seleziona almeno una lettera da cambiare.', 1500);
      return;
    }
    if (bag.length < swapSelection.length) {
      showNotification('Non ci sono abbastanza tessere nel sacchetto.', 2000);
      return;
    }
    if (gameMode === 'mp') { mpSubmitSwap(); return; }

    const lettersToSwap = swapSelection.map(i => playerRack[i]);
    const sortedDesc = [...swapSelection].sort((a, b) => b - a);
    for (const idx of sortedDesc) playerRack.splice(idx, 1);
    for (const l of lettersToSwap) bag.push(l);
    shuffleArray(bag);
    drawTiles(playerRack);

    exitSwapMode();
    renderRack();
    renderBoard();
    showNotification(`Hai cambiato ${lettersToSwap.length} tessere.`, 1800);

    turn = 'cpu';
    syncUI();
    updateTurnIndicator();
    isCpuThinking = true;
    setTimeout(cpuMove, 900);
  }

  // ---------- Drag & drop tramite Pointer Events (nessuno zoom della board) ----------
  function attachRackDrag(slot, index) {
    slot.addEventListener('pointerdown', (e) => {
      if (!canEditDraft()) return;
      if (index >= playerRack.length) return;
      e.preventDefault();

      if (swapMode) {
        toggleSwapSelection(index);
        renderRack();
        syncUI();
        return;
      }

      dragState = {
        fromIndex: index,
        letter: playerRack[index],
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        pointerId: e.pointerId,
        slot
      };

      try { slot.setPointerCapture(e.pointerId); } catch (err) {}
      slot.addEventListener('pointermove', onDragMove);
      slot.addEventListener('pointerup', onDragEnd);
      slot.addEventListener('pointercancel', onDragCancel);
    });
  }

  function createGhost(letter) {
    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.textContent = letter;
    document.body.appendChild(ghost);
    dragGhostEl = ghost;
  }

  function positionGhost(x, y) {
    if (dragGhostEl) {
      dragGhostEl.style.left = x + 'px';
      dragGhostEl.style.top = y + 'px';
    }
  }

  function removeGhost() {
    if (dragGhostEl) { dragGhostEl.remove(); dragGhostEl = null; }
  }

  // Indice dello slot del rack sotto il dito (o il più vicino in orizzontale se il dito è
  // sulla fascia del rack ma tra due tessere). -1 se il dito non è sul rack.
  function rackIndexAt(x, y) {
    const box = rackSlotsEl.getBoundingClientRect();
    if (y < box.top - 20 || y > box.bottom + 20 || x < box.left - 20 || x > box.right + 20) return -1;
    let best = -1, bestD = Infinity;
    Array.from(rackSlotsEl.children).forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const d = Math.abs(x - (r.left + r.width / 2));
      if (d < bestD) { bestD = d; best = i; }
    });
    return best;
  }

  let hoverRackSlotEl = null;
  function clearHoverRack() {
    if (hoverRackSlotEl) { hoverRackSlotEl.classList.remove('rack-drop-hover'); hoverRackSlotEl = null; }
  }

  // Sposta la tessera da "from" a "to" nel rack (le altre scorrono), come trascinare una tessera vera.
  function moveRackTile(from, to) {
    if (playerRack.length < 2) return;
    to = Math.max(0, Math.min(to, playerRack.length - 1));
    if (from === to) return;
    const [t] = playerRack.splice(from, 1);
    playerRack.splice(to, 0, t);
    selectedTileIndex = -1;
    haptic(10);
    renderRack();
  }

  function updateHoverCell(x, y) {
    clearHoverCell();
    clearHoverRack();
    if (dragState) {
      const ri = rackIndexAt(x, y);
      if (ri >= 0 && ri < playerRack.length && ri !== dragState.fromIndex) {
        hoverRackSlotEl = rackSlotsEl.children[ri];
        hoverRackSlotEl.classList.add('rack-drop-hover');
        return;
      }
    }
    const el = document.elementFromPoint(x, y);
    const cellEl = el && el.closest ? el.closest('.cell') : null;
    if (cellEl) {
      const r = +cellEl.dataset.row, c = +cellEl.dataset.col;
      if (board[r][c] === null && !pendingTiles.some(t => t.row === r && t.col === c)) {
        cellEl.classList.add('drop-hover');
        hoverCellEl = cellEl;
      }
    }
  }

  function clearHoverCell() {
    if (hoverCellEl) { hoverCellEl.classList.remove('drop-hover'); hoverCellEl = null; }
  }

  function onDragMove(e) {
    if (!dragState) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (!dragState.moved && Math.hypot(dx, dy) > 8) {
      dragState.moved = true;
      createGhost(dragState.letter);
      dragState.slot.classList.add('dragging-source');
    }
    if (dragState.moved) {
      positionGhost(e.clientX, e.clientY);
      updateHoverCell(e.clientX, e.clientY);
    }
  }

  function finishDrag(e) {
    if (!dragState) return;
    const { slot, moved, fromIndex } = dragState;
    slot.removeEventListener('pointermove', onDragMove);
    slot.removeEventListener('pointerup', onDragEnd);
    slot.removeEventListener('pointercancel', onDragCancel);
    slot.classList.remove('dragging-source');

    if (moved) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cellEl = el && el.closest ? el.closest('.cell') : null;
      const rackTarget = rackIndexAt(e.clientX, e.clientY);
      removeGhost();
      clearHoverCell();
      clearHoverRack();
      if (cellEl) {
        placeTileAt(+cellEl.dataset.row, +cellEl.dataset.col, fromIndex);
      } else if (rackTarget >= 0) {
        moveRackTile(fromIndex, rackTarget);     // rilasciata sul rack: cambia posto alla tessera
      }
    } else {
      // Nessun movimento: era un semplice tocco -> arma/disarma la lettera
      toggleSelectTile(fromIndex);
    }
    dragState = null;
  }

  function onDragEnd(e) { finishDrag(e); }
  function onDragCancel() {
    if (!dragState) return;
    const { slot } = dragState;
    slot.removeEventListener('pointermove', onDragMove);
    slot.removeEventListener('pointerup', onDragEnd);
    slot.removeEventListener('pointercancel', onDragCancel);
    slot.classList.remove('dragging-source');
    removeGhost();
    clearHoverCell();
    clearHoverRack();
    dragState = null;
  }

  // ---------- Trascinamento di una tessera già piazzata (pending) tra caselle ----------
  function attachBoardTileDrag(cellEl, row, col) {
    cellEl.addEventListener('pointerdown', (e) => {
      if (!canEditDraft()) return;
      const pending = pendingTiles.find(t => t.row === row && t.col === col);
      if (!pending) return;
      e.preventDefault();

      boardDragState = {
        fromRow: row,
        fromCol: col,
        letter: pending.letter,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        pointerId: e.pointerId,
        cellEl
      };

      try { cellEl.setPointerCapture(e.pointerId); } catch (err) {}
      cellEl.addEventListener('pointermove', onBoardDragMove);
      cellEl.addEventListener('pointerup', onBoardDragEnd);
      cellEl.addEventListener('pointercancel', onBoardDragCancel);
    });
  }

  function onBoardDragMove(e) {
    if (!boardDragState) return;
    const dx = e.clientX - boardDragState.startX;
    const dy = e.clientY - boardDragState.startY;
    if (!boardDragState.moved && Math.hypot(dx, dy) > 5) {
      boardDragState.moved = true;
      createGhost(boardDragState.letter);
      boardDragState.cellEl.classList.add('dragging-source');
    }
    if (boardDragState.moved) {
      positionGhost(e.clientX, e.clientY);
      updateHoverCell(e.clientX, e.clientY);
    }
  }

  function finishBoardDrag(e) {
    if (!boardDragState) return;
    const { cellEl, moved, fromRow, fromCol } = boardDragState;
    cellEl.removeEventListener('pointermove', onBoardDragMove);
    cellEl.removeEventListener('pointerup', onBoardDragEnd);
    cellEl.removeEventListener('pointercancel', onBoardDragCancel);
    cellEl.classList.remove('dragging-source');

    if (moved) {
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const targetCellEl = el && el.closest ? el.closest('.cell') : null;
      removeGhost();
      clearHoverCell();
      if (targetCellEl) {
        const tr = +targetCellEl.dataset.row, tc = +targetCellEl.dataset.col;
        const isSame = tr === fromRow && tc === fromCol;
        const isFree = board[tr][tc] === null && !pendingTiles.some(t => t.row === tr && t.col === tc);
        if (!isSame && isFree) {
          const idx = pendingTiles.findIndex(t => t.row === fromRow && t.col === fromCol);
          if (idx !== -1) pendingTiles[idx] = { row: tr, col: tc, letter: pendingTiles[idx].letter, isBlank: pendingTiles[idx].isBlank };
        }
        // Se la casella target non è valida (occupata o è la stessa), la tessera
        // resta semplicemente dov'era: nessuna modifica da fare.
      } else {
        // Rilasciata fuori dalla board (es. sul rack): torna in mano.
        returnPendingToRack(fromRow, fromCol);
        lastBoardDragEndAt = Date.now();
        boardDragState = null;
        return;
      }
      renderBoard();
      syncUI();
    } else {
      // Nessun movimento: era un semplice tocco -> richiama la tessera nel rack
      recallPendingTileAt(fromRow, fromCol);
    }
    lastBoardDragEndAt = Date.now();
    boardDragState = null;
  }

  function onBoardDragEnd(e) { finishBoardDrag(e); }
  function onBoardDragCancel() {
    if (!boardDragState) return;
    const { cellEl } = boardDragState;
    cellEl.removeEventListener('pointermove', onBoardDragMove);
    cellEl.removeEventListener('pointerup', onBoardDragEnd);
    cellEl.removeEventListener('pointercancel', onBoardDragCancel);
    cellEl.classList.remove('dragging-source');
    removeGhost();
    clearHoverCell();
    lastBoardDragEndAt = Date.now();
    boardDragState = null;
  }

  // ==================== LOGICA DI GIOCO ====================
  function getWordFromMove(row, col, horizontal, boardState) {
    let word = '';
    let r = row, c = col;
    if (horizontal) {
      while (c > 0 && boardState[r][c-1] !== null) c--;
      while (c < BOARD_SIZE && boardState[r][c] !== null) {
        word += boardState[r][c];
        c++;
      }
    } else {
      while (r > 0 && boardState[r-1][c] !== null) r--;
      while (r < BOARD_SIZE && boardState[r][c] !== null) {
        word += boardState[r][c];
        r++;
      }
    }
    return word.length > 1 ? word : '';
  }

  // Come getWordFromMove, ma restituisce le celle [riga,colonna] della parola invece del testo.
  // Serve per disegnare la cornice colorata (verde/rossa) intorno alla parola in formazione.
  function getWordCellsFromMove(row, col, horizontal, boardState) {
    let cells = [];
    let r = row, c = col;
    if (horizontal) {
      while (c > 0 && boardState[r][c-1] !== null) c--;
      while (c < BOARD_SIZE && boardState[r][c] !== null) { cells.push([r, c]); c++; }
    } else {
      while (r > 0 && boardState[r-1][c] !== null) r--;
      while (r < BOARD_SIZE && boardState[r][c] !== null) { cells.push([r, c]); r++; }
    }
    return cells.length > 1 ? cells : [];
  }

  // Restituisce le parole (liste di celle [r,c]) formate dalle tessere pendenti:
  // prima la parola principale, poi le eventuali parole incrociate.
  function computePreviewWords(moveTiles) {
    const words = [];
    if (moveTiles.length === 0) return words;
    const simBoard = board.map(row => [...row]);
    for (const t of moveTiles) {
      if (simBoard[t.row][t.col] === null) simBoard[t.row][t.col] = t.letter;
    }
    const rows = moveTiles.map(t => t.row);
    const cols = moveTiles.map(t => t.col);
    const sameRow = rows.every(r => r === rows[0]);
    const sameCol = cols.every(c => c === cols[0]);
    if (!(sameRow || sameCol)) return words;
    let horizontal = sameRow;
    let main = getWordCellsFromMove(moveTiles[0].row, moveTiles[0].col, horizontal, simBoard);
    if (main.length === 0 && moveTiles.length === 1) {
      horizontal = !horizontal;
      main = getWordCellsFromMove(moveTiles[0].row, moveTiles[0].col, horizontal, simBoard);
    }
    if (main.length) words.push(main);
    const seen = new Set();
    for (const t of moveTiles) {
      const cross = getWordCellsFromMove(t.row, t.col, !horizontal, simBoard);
      if (!cross.length) continue;
      const key = cross[0][0] + ',' + cross[0][1];
      if (seen.has(key)) continue;
      seen.add(key);
      words.push(cross);
    }
    return words;
  }

  // Disegna sopra il tabellone: cornici delle parole in formazione (verde/rossa),
  // badge col punteggio fuori dalla cornice e badge blu con i punti dell'ultima
  // parola giocata dalla CPU.
  // Rettangolo di una cella calcolato dal layout, NON da getBoundingClientRect: quest'ultimo cambia mentre
  // la tessera "rimbalza" (scale) e faceva uscire le cornici storte. Così le cornici che si incrociano
  // condividono sempre gli stessi bordi.
  function cellRect(r, c) {
    const el = boardEl.children[r * BOARD_SIZE + c];
    const par = el.offsetParent || boardEl;
    const pr = par.getBoundingClientRect();
    const left = pr.left + par.clientLeft + el.offsetLeft, top = pr.top + par.clientTop + el.offsetTop;
    return { left, top, right: left + el.offsetWidth, bottom: top + el.offsetHeight, width: el.offsetWidth, height: el.offsetHeight };
  }

  function drawOverlays() {
    const wrapper = document.querySelector('.board-wrapper');
    if (!wrapper) return;
    let overlay = wrapper.querySelector('.board-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'board-overlay';
      wrapper.appendChild(overlay);
    }
    overlay.innerHTML = '';
    const wr = wrapper.getBoundingClientRect();
    const cellEl = (r, c) => boardEl.children[r * BOARD_SIZE + c];

    if (pendingTiles.length === 0) lastPreviewBadgeKey = null;
    if (pendingTiles.length > 0 && !gameOver && !swapMode) {
      const words = computePreviewWords(pendingTiles);
      if (words.length) {
        const result = validateAndScoreMove(pendingTiles);
        let mainRect = null;
        words.forEach((cells, i) => {
          const first = cellRect(cells[0][0], cells[0][1]);
          const last = cellRect(cells[cells.length - 1][0], cells[cells.length - 1][1]);
          const left = Math.min(first.left, last.left) - wr.left - 3;
          const top = Math.min(first.top, last.top) - wr.top - 3;
          const right = Math.max(first.right, last.right) - wr.left + 3;
          const bottom = Math.max(first.bottom, last.bottom) - wr.top + 3;
          const f = document.createElement('div');
          f.className = 'word-frame' + (result.valid ? '' : ' invalid');
          f.style.left = left + 'px';
          f.style.top = top + 'px';
          f.style.width = (right - left) + 'px';
          f.style.height = (bottom - top) + 'px';
          overlay.appendChild(f);
          if (i === 0) mainRect = { cells };
        });
        if (result.valid && mainRect) {
          // Rombo verde appoggiato all'angolo della cornice, tutto fuori dalle lettere
          const pos = badgeOutsideCorner(mainRect.cells, wr, 1.5);
          const b = document.createElement('div');
          const badgeKey = result.score + '@' + mainRect.cells[0][0] + '_' + mainRect.cells[0][1];
          b.className = 'score-badge' + (badgeKey !== lastPreviewBadgeKey ? ' pop' : '');
          lastPreviewBadgeKey = badgeKey;
          b.style.left = pos.x + 'px';
          b.style.top = pos.y + 'px';
          b.innerHTML = '<span>' + result.score + '</span>';
          overlay.appendChild(b);
        }
      }
    }

    if (lastMove && board[lastMove.row][lastMove.col]) {
      // Pallino dei punti dell'ultima parola: sull'angolo esterno della parola, mai sulle lettere
      const cells = (lastMove.cells && lastMove.cells.length) ? lastMove.cells : [[lastMove.row, lastMove.col]];
      const pos = badgeOutsideCorner(cells, wr, 0.07 * cellRect(lastMove.row, lastMove.col).width);
      const b = document.createElement('div');
      const mvKey = lastMove.row + '_' + lastMove.col + '@' + lastMove.score;
      b.className = 'last-move-badge' + (lastMove.mine ? ' mine' : '') + (mvKey !== lastMoveBadgeKey ? ' pop' : '');
      lastMoveBadgeKey = mvKey;
      b.style.left = pos.x + 'px';
      b.style.top = pos.y + 'px';
      b.textContent = lastMove.score;
      overlay.appendChild(b);
    } else {
      lastMoveBadgeKey = null;
    }
  }

  // Calcola dove mettere un badge di punteggio attaccato all'angolo di una parola,
  // ma verso l'esterno (fuori dalle tessere). Prova gli angoli in ordine
  // (basso-destra, alto-destra, basso-sinistra, alto-sinistra) e sceglie il primo
  // la cui casella diagonale esterna è libera; 'off' = quanto sporge in px.
  function badgeOutsideCorner(cells, wr, off) {
    const rs = cells.map(c => c[0]), cs = cells.map(c => c[1]);
    const r0 = Math.min(...rs), r1 = Math.max(...rs);
    const c0 = Math.min(...cs), c1 = Math.max(...cs);
    const rect0 = cellRect(r0, c0);
    const rect1 = cellRect(r1, c1);
    const corners = [
      { dr: 1,  dc: 1,  x: rect1.right, y: rect1.bottom },
      { dr: -1, dc: 1,  x: rect1.right, y: rect0.top },
      { dr: 1,  dc: -1, x: rect0.left,  y: rect1.bottom },
      { dr: -1, dc: -1, x: rect0.left,  y: rect0.top }
    ];
    const free = (r, c) => r < 0 || c < 0 || r >= BOARD_SIZE || c >= BOARD_SIZE || !board[r][c];
    let pick = corners[0];
    for (const k of corners) {
      const rr = (k.dr > 0 ? r1 : r0) + k.dr;
      const cc = (k.dc > 0 ? c1 : c0) + k.dc;
      const rEdge = (k.dr > 0 ? r1 : r0), cEdge = (k.dc > 0 ? c1 : c0);
      if (free(rr, cc) && free(rr, cEdge) && free(rEdge, cc)) { pick = k; break; }
    }
    return { x: pick.x - wr.left + pick.dc * off, y: pick.y - wr.top + pick.dr * off };
  }

  window.addEventListener('resize', () => setTimeout(drawOverlays, 50));

  function validateAndScoreMove(moveTiles) {
    if (moveTiles.length === 0) return { valid: false, score: 0, words: [], error: 'Nessuna tessera posizionata' };

    const simBoard = board.map(row => [...row]);
    for (let { row, col, letter } of moveTiles) {
      if (simBoard[row][col] !== null) return { valid: false, score: 0, words: [], error: 'Cella occupata' };
      simBoard[row][col] = letter;
    }

    const rows = moveTiles.map(t => t.row);
    const cols = moveTiles.map(t => t.col);
    const sameRow = rows.every(r => r === rows[0]);
    const sameCol = cols.every(c => c === cols[0]);
    if (!sameRow && !sameCol) return { valid: false, score: 0, words: [], error: 'Tessere non allineate' };

    if (sameRow) {
      const minC = Math.min(...cols);
      const maxC = Math.max(...cols);
      for (let c = minC; c <= maxC; c++) {
        if (simBoard[rows[0]][c] === null) return { valid: false, score: 0, words: [], error: 'Tessere non contigue' };
      }
    } else {
      const minR = Math.min(...rows);
      const maxR = Math.max(...rows);
      for (let r = minR; r <= maxR; r++) {
        if (simBoard[r][cols[0]] === null) return { valid: false, score: 0, words: [], error: 'Tessere non contigue' };
      }
    }

    if (!firstMoveDone) {
      const coversCenter = moveTiles.some(t => t.row === CENTER && t.col === CENTER);
      if (!coversCenter) return { valid: false, score: 0, words: [], error: 'Devi coprire la stella centrale' };
    } else {
      let adjacent = false;
      for (let { row, col } of moveTiles) {
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        for (let [dr, dc] of dirs) {
          const nr = row + dr, nc = col + dc;
          if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== null) {
            adjacent = true;
            break;
          }
        }
        if (adjacent) break;
      }
      if (!adjacent) return { valid: false, score: 0, words: [], error: 'Devi collegarti a una tessera esistente' };
    }

    const words = [];
    const horizontal = sameRow;
    const mainWord = getWordFromMove(moveTiles[0].row, moveTiles[0].col, horizontal, simBoard);
    if (mainWord.length > 1) words.push(mainWord);

    for (let { row, col } of moveTiles) {
      const perpWord = getWordFromMove(row, col, !horizontal, simBoard);
      if (perpWord.length > 1) words.push(perpWord);
    }

    if (words.length === 0) return { valid: false, score: 0, words: [], error: 'Nessuna parola valida' };

    const invalidWord = words.find(w => {
      const lw = w.toLowerCase();
      return !ITALIAN_WORDS.has(lw) || BANNED_WORDS.has(lw);   // le parole vietate vincono sempre
    });
    if (invalidWord) return { valid: false, score: 0, words: [], error: `"${invalidWord}" non è nel dizionario` };

    function scoreWord(word, startRow, startCol, horiz, simBoard, moveTiles) {
      let score = 0;
      let multiplier = 1;
      let r = startRow, c = startCol;
      const moveSet = new Set(moveTiles.map(t => `${t.row},${t.col}`));
      for (let i = 0; i < word.length; i++) {
        const letter = simBoard[r][c];
        const isNew = moveSet.has(`${r},${c}`);
        let letterScore = LETTER_VALUES[letter] || 0;
        if (isNew) {
          const premium = PREMIUM_LAYOUT[r][c];
          if (premium === 1) letterScore *= 2;
          else if (premium === 2) letterScore *= 3;
          else if (premium === 3) multiplier *= 2;
          else if (premium === 4) multiplier *= 3;
          else if (premium === 5) multiplier *= 2;
        }
        score += letterScore;
        if (horiz) c++; else r++;
      }
      return score * multiplier;
    }

    function findStart(r, c, horiz) {
      if (horiz) {
        while (c > 0 && simBoard[r][c-1] !== null) c--;
      } else {
        while (r > 0 && simBoard[r-1][c] !== null) r--;
      }
      return { r, c };
    }

    let total = 0;
    if (mainWord.length > 1) {
      const start = findStart(moveTiles[0].row, moveTiles[0].col, horizontal);
      total += scoreWord(mainWord, start.r, start.c, horizontal, simBoard, moveTiles);
    }

    for (let { row, col } of moveTiles) {
      const perpWord = getWordFromMove(row, col, !horizontal, simBoard);
      if (perpWord.length > 1) {
        const start = findStart(row, col, !horizontal);
        total += scoreWord(perpWord, start.r, start.c, !horizontal, simBoard, moveTiles);
      }
    }

    if (moveTiles.length === 7) total += 50;

    return { valid: true, score: total, words: words, error: '' };
  }

  function getFlyLayer() {
    if (!flyLayerEl || !flyLayerEl.isConnected) {
      const container = document.querySelector('.app-container');
      flyLayerEl = document.createElement('div');
      flyLayerEl.className = 'fly-layer';
      container.appendChild(flyLayerEl);
    }
    return flyLayerEl;
  }

  // Anima l'invio di una parola: le lettere "saltano" una dopo l'altra, il resto del
  // tabellone si affievolisce, poi da ogni lettera parte un punto che vola con una
  // traiettoria ad arco verso il riquadro del punteggio, che nel frattempo conta verso
  // l'alto e "batte" a ogni arrivo. cellsWithLetters: [{row, col, letter}]. Richiama
  // onDone a fine animazione (sempre, anche se non ci sono celle da animare).
  // Vibrazione "a rullo" per i punti: parte nello stesso istante in cui il punteggio sale.
  // Ogni tessera che arriva dà un tic (più punti a quella tessera = più impulsi ravvicinati);
  // all'ultima tessera si aggiunge una coda che rallenta: più punti totali = più rullo.
  function scoreHaptic(share, isLast, total) {
    if (!hapticsOn()) return;
    const k = Math.max(1, Math.min(3, Math.ceil(share / 4)));
    const pat = [];                                   // [vibra, pausa, vibra, ...]
    for (let j = 0; j < k; j++) { if (j) pat.push(9); pat.push(7); }
    if (isLast) {
      const nT = Math.min(12, Math.floor(total / 4));
      for (let j = 0; j < nT; j++) { pat.push(35 + j * 14); pat.push(7); }   // pause sempre più lunghe
      pat.push(60); pat.push(30);                     // colpo finale
    }
    haptic(pat);
  }

  function animateWordSubmit(cellsWithLetters, score, scoreEl, startScore, onDone) {
    const wrapper = document.querySelector('.board-wrapper');
    if (!cellsWithLetters.length || !wrapper || score <= 0) { onDone(); return; }

    const cellEl = (r, c) => boardEl.children[r * BOARD_SIZE + c];
    const playedSet = new Set(cellsWithLetters.map(t => t.row + '_' + t.col));
    boardEl.querySelectorAll('.cell.occupied, .cell.pending').forEach(el => {
      if (!playedSet.has(el.dataset.row + '_' + el.dataset.col)) el.classList.add('dim-cell');
    });
    cellsWithLetters.forEach((t, i) => {
      const el = cellEl(t.row, t.col);
      if (!el) return;
      el.style.animationDelay = (i * 55) + 'ms';
      el.classList.add('pop-cell');
    });

    const popPhase = (cellsWithLetters.length - 1) * 55 + 420;

    setTimeout(() => {
      const layer = getFlyLayer();
      const appRect = document.querySelector('.app-container').getBoundingClientRect();
      const targetRect = scoreEl.getBoundingClientRect();
      const tx = targetRect.left + targetRect.width / 2 - appRect.left;
      const ty = targetRect.top + targetRect.height / 2 - appRect.top;

      const n = cellsWithLetters.length;
      const per = Math.floor(score / n);
      const shares = new Array(n).fill(per);
      let rest = score - per * n;
      for (let i = n - 1; rest > 0; i--, rest--) shares[i] += 1;

      let shown = startScore;
      let arrivedCount = 0;

      cellsWithLetters.forEach((t, i) => {
        const el = cellEl(t.row, t.col);
        const rect = el ? el.getBoundingClientRect() : targetRect;
        const sx = rect.left + rect.width / 2 - appRect.left;
        const sy = rect.top + rect.height / 2 - appRect.top;

        const ghost = document.createElement('div');
        ghost.className = 'fly-tile';
        ghost.textContent = t.letter;
        layer.appendChild(ghost);

        const dx = tx - sx, dy = ty - sy;
        const cx = sx + dx * 0.5;
        const cy = Math.min(sy, ty) - Math.max(70, Math.abs(dx) * 0.3) - i * 8;

        const duration = 460 + i * 30;
        const delay = i * 50;
        const startAt = performance.now() + delay;

        function step(now) {
          let t2 = (now - startAt) / duration;
          if (t2 < 0) { requestAnimationFrame(step); return; }
          if (t2 > 1) t2 = 1;
          const e = t2 < 0.5 ? 2 * t2 * t2 : 1 - Math.pow(-2 * t2 + 2, 2) / 2;
          const x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * cx + e * e * tx;
          const y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * ty;
          const scale = 1 - 0.5 * e;
          const opacity = t2 < 0.7 ? 1 : 1 - (t2 - 0.7) / 0.3;
          ghost.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
          ghost.style.opacity = opacity;
          if (t2 < 1) {
            requestAnimationFrame(step);
          } else {
            ghost.remove();
            arrivedCount++;
            shown += shares[i];
            scoreEl.textContent = shown;
            scoreEl.classList.remove('score-pulse');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('score-pulse');
            scoreHaptic(shares[i], arrivedCount === n, score);
            if (arrivedCount === n) {
              scoreEl.textContent = startScore + score;
              boardEl.querySelectorAll('.dim-cell').forEach(el2 => el2.classList.remove('dim-cell'));
              boardEl.querySelectorAll('.pop-cell').forEach(el2 => { el2.classList.remove('pop-cell'); el2.style.animationDelay = ''; });
              onDone();
            }
          }
        }
        requestAnimationFrame(step);
      });
    }, popPhase);
  }

  function commitMove(moveTiles) {
    for (let { row, col, letter } of moveTiles) {
      board[row][col] = letter;
    }
    firstMoveDone = true;
  }

  // ==================== AZIONI GIOCATORE ====================
  function playerPlay() {
    if (turn !== 'player' || gameOver || isCpuThinking) return;
    if (pendingTiles.length === 0) {
      showNotification('Piazza almeno una lettera sulla board!', 1500);
      return;
    }

    const result = validateAndScoreMove(pendingTiles);
    if (!result.valid) {
      showNotification('Mossa non valida: ' + result.error, 2000);
      return;
    }

    if (gameMode === 'mp') { mpSubmitWord(result); return; }

    const wordsPlayed = result.words.join(', ');
    const scorePlayed = result.score;
    const startScore = playerScore;
    const movedTiles = pendingTiles.slice();

    headerMessageEl.textContent = `Hai giocato ${wordsPlayed} per ${scorePlayed} punti`;
    showNotification(`+${scorePlayed} punti! ${wordsPlayed}`, 2500);
    isCpuThinking = true;   // riusato come "occupato": blocca tocchi/drag durante l'animazione
    playBtn.disabled = true;
    skipBtn.disabled = true;

    animateWordSubmit(movedTiles, scorePlayed, playerScoreEl, startScore, () => {
      commitMove(movedTiles);
      lastMove = null;
      playerScore = startScore + scorePlayed;
      gems += Math.floor(scorePlayed / 3);
      pendingTiles = [];
      drawTiles(playerRack, 1);

      clearSelection();
      updateScores();
      renderBoard();
      renderRack();
      isCpuThinking = false;

      if (playerRack.length === 0 && bag.length === 0) {
        endGame();
        return;
      }

      turn = 'cpu';
      syncUI();
      updateTurnIndicator();
      isCpuThinking = true;
      setTimeout(cpuMove, 1000);
    });
  }

  function skipTurn() {
    if (turn !== 'player' || gameOver || isCpuThinking) return;
    if (pendingTiles.length > 0) {
      showNotification('Ritira prima le lettere piazzate.', 1500);
      return;
    }
    if (gameMode === 'mp') { mpSubmitPass(); return; }
    clearSelection();
    renderBoard();
    renderRack();
    showNotification('Turno passato.', 1200);
    turn = 'cpu';
    syncUI();
    updateTurnIndicator();
    isCpuThinking = true;
    setTimeout(cpuMove, 800);
  }

  // ==================== CPU ====================
  function cpuMove() {
    // Se nel frattempo sei uscito dalla partita CPU (o sei entrato in una online) non toccare lo stato:
    // la mossa in sospeso verrà rigiocata quando riapri la partita CPU (vedi loadSavedGame).
    if (gameMode !== 'cpu') return;
    if (gameOver) {
      isCpuThinking = false;
      return;
    }
    if (cpuRack.length === 0 && bag.length === 0) {
      endGame();
      isCpuThinking = false;
      return;
    }

    const move = findCpuMove();
    if (move) {
      commitMove(move.tiles);
      const draftDropped = recallDraftAfterOpponentWord();
      for (let t of move.tiles) {
        const idx = cpuRack.indexOf(t.letter);
        if (idx !== -1) cpuRack.splice(idx, 1);
      }
      drawTiles(cpuRack);
      renderBoard();   // mostra subito le lettere appena giocate (già "occupied")
      renderRack();    // mostra subito eventuali tessere tue tornate in mano

      const startScore = cpuScore;
      const wordsLabel = (move.words && move.words.length) ? move.words.join(', ') : '';
      animateWordSubmit(move.tiles, move.score, cpuScoreEl, startScore, () => {
        cpuScore = startScore + move.score;
        const lastTile = move.tiles[move.tiles.length - 1];
        lastMove = { row: lastTile.row, col: lastTile.col, score: move.score, cells: move.tiles.map(t => [t.row, t.col]) };
        updateScores();
        renderBoard();
        showNotification(`CPU ha giocato ${wordsLabel} per ${move.score} punti!` + (draftDropped ? ' · le tue tessere sono tornate in mano' : ''), 2500);
        finishCpuTurn();
      });
    } else {
      recallDraftAfterOpponentWord();
      const swapped = cpuTrySwap();
      if (swapped > 0) {
        showNotification(`CPU ha cambiato ${swapped} tessere.`, 1800);
      } else {
        showNotification('CPU passa il turno.', 1500);
      }
      finishCpuTurn();
    }
  }

  function finishCpuTurn() {
    if (cpuRack.length === 0 && bag.length === 0) {
      endGame();
      isCpuThinking = false;
      return;
    }

    turn = 'player';
    isCpuThinking = false;
    clearSelection();
    syncUI();
    updateTurnIndicator();
    renderBoard();
    renderRack();
  }

  // La CPU può fare le stesse cose del giocatore: giocare parole (anche multi-lettera),
  // cambiare tessere, o passare se non trova nulla di meglio.

  function findCpuMove() {
    if (!firstMoveDone) return findCpuMoveEmptyBoard();
    return findCpuMoveOnBoard();
  }

  function cpuTrySwap() {
    if (bag.length === 0 || cpuRack.length === 0) return 0;
    const swapCount = Math.min(cpuRack.length, bag.length);
    const removed = cpuRack.splice(0, swapCount);
    for (const l of removed) bag.push(l);
    shuffleArray(bag);
    drawTiles(cpuRack);
    return swapCount;
  }

  // Genera le celle "ancora": caselle vuote adiacenti ad almeno una tessera già piazzata
  function collectAnchors() {
    const anchors = [];
    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        if (board[r][c] === null) {
          const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
          for (const [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] !== null) {
              anchors.push({ row: r, col: c });
              break;
            }
          }
        }
      }
    }
    return anchors;
  }

  // Tutte le combinazioni di k indici su n (per scegliere sottoinsiemi del rack)
  function combinationsOfIndices(n, k) {
    const result = [];
    const combo = [];
    function backtrack(start) {
      if (combo.length === k) { result.push(combo.slice()); return; }
      for (let i = start; i < n; i++) {
        combo.push(i);
        backtrack(i + 1);
        combo.pop();
      }
    }
    backtrack(0);
    return result;
  }

  // Tutte le permutazioni di un array di lettere
  function permute(arr) {
    if (arr.length <= 1) return [arr];
    const result = [];
    for (let i = 0; i < arr.length; i++) {
      const rest = arr.slice(0, i).concat(arr.slice(i + 1));
      for (const p of permute(rest)) result.push([arr[i], ...p]);
    }
    return result;
  }

  // Genera sequenze di lettere candidate dal rack (deduplicate, ordinate dalla più corta),
  // con un tetto alle dimensioni grandi per non esplodere in numero di combinazioni
  function candidatePermutations(rackLetters, maxSize, capBig) {
    maxSize = maxSize || Math.min(rackLetters.length, 5);
    capBig = capBig || 60;
    const n = rackLetters.length;
    const out = [];
    const seen = new Set();
    for (let size = 1; size <= maxSize && size <= n; size++) {
      let countThisSize = 0;
      const limit = size >= 5 ? capBig : Infinity;
      const combos = combinationsOfIndices(n, size);
      outer:
      for (const combo of combos) {
        const letters = combo.map(i => rackLetters[i]);
        const perms = permute(letters);
        for (const p of perms) {
          const key = p.join('|');
          if (seen.has(key)) continue;
          seen.add(key);
          out.push(p);
          countThisSize++;
          if (countThisSize >= limit) break outer;
        }
      }
    }
    out.sort((a, b) => a.length - b.length);
    return out;
  }

  // Ricerca sulla board già avviata: prova a piazzare sequenze di lettere a partire da ogni
  // "ancora" (casella vuota adiacente a una tessera esistente), in tutte le direzioni.
  // La parola completa (comprese le lettere già sul tabellone) viene ricostruita e valutata
  // da validateAndScoreMove esattamente come per il giocatore.
  function findCpuMoveOnBoard() {
    const anchors = collectAnchors();
    if (anchors.length === 0) return findCpuMoveEmptyBoard();

    const sequences = candidatePermutations(cpuRack, 4);
    let best = null;
    let evaluated = 0;
    const MAX_EVAL = 6000;

    outerLoop:
    for (const anchor of anchors) {
      for (const [dr, dc] of [[0,1],[0,-1],[1,0],[-1,0]]) {
        let maxLen = 0, r = anchor.row, c = anchor.col;
        while (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === null) {
          maxLen++;
          r += dr; c += dc;
        }
        if (maxLen === 0) continue;

        for (const seq of sequences) {
          if (seq.length > maxLen) continue;
          evaluated++;
          if (evaluated > MAX_EVAL) break outerLoop;

          const cells = [];
          for (let i = 0; i < seq.length; i++) {
            cells.push({ row: anchor.row + dr * i, col: anchor.col + dc * i, letter: seq[i] });
          }
          const result = validateAndScoreMove(cells);
          if (result.valid && (!best || result.score > best.score)) {
            best = { tiles: cells, score: result.score, words: result.words };
          }
        }
      }
    }
    return best;
  }

  // Board vuota (accade solo se il giocatore passa/cambia prima di aprire la partita):
  // la CPU deve coprire la stella centrale.
  function findCpuMoveEmptyBoard() {
    const sequences = candidatePermutations(cpuRack, Math.min(cpuRack.length, 7), 40);
    let best = null;
    for (const seq of sequences) {
      for (let startCol = CENTER - seq.length + 1; startCol <= CENTER; startCol++) {
        if (startCol < 0 || startCol + seq.length - 1 >= BOARD_SIZE) continue;
        const cells = seq.map((letter, i) => ({ row: CENTER, col: startCol + i, letter }));
        const result = validateAndScoreMove(cells);
        if (result.valid && (!best || result.score > best.score)) {
          best = { tiles: cells, score: result.score, words: result.words };
        }
      }
    }
    return best;
  }

  // ==================== FINE PARTITA ====================
  function endGame() {
    gameOver = true;
    turn = 'none';
    isCpuThinking = false;
    saveGameState();
    let msg = `Partita finita! Tu: ${playerScore} - CPU: ${cpuScore}. `;
    if (playerScore > cpuScore) msg += 'Hai vinto! 🎉';
    else if (playerScore < cpuScore) msg += 'CPU vince.';
    else msg += 'Pareggio.';
    headerMessageEl.textContent = msg;
    showNotification(msg, 5000);
    updateTurnIndicator();
    renderBoard();
    renderRack();
    playBtn.disabled = true;
    skipBtn.disabled = true;
  }

  // ==================== NUOVA PARTITA ====================
  // ==================== PARTITA SALVATA (localStorage) ====================
  // Ad ogni cambio di stato la partita viene salvata in locale sul dispositivo:
  // se chiudi o ricarichi la pagina (anche per un aggiornamento automatico della
  // webapp), al riavvio ritrovi la stessa identica partita ancora attiva.
  const SAVE_KEY = 'scrabbleGoPoveryPartitaSalvata';

  function saveGameState() {
    if (gameMode !== 'cpu') return;   // nel multiplayer lo stato vero è su Firestore; localStorage resta della partita CPU
    try {
      const state = {
        v: 1,
        board, playerRack, cpuRack, bag,
        playerScore, cpuScore, turn, gameOver,
        firstMoveDone, gems, pendingTiles, lastMove
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (err) {
      console.warn('Impossibile salvare la partita in locale:', err);
    }
  }

  function clearSavedGame() {
    try { localStorage.removeItem(SAVE_KEY); } catch (err) { /* ignora */ }
  }

  // Prova a ripristinare l'ultima partita salvata. Restituisce true se ci è
  // riuscita (e in tal caso NON va chiamata newGame()).
  function loadSavedGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const state = JSON.parse(raw);
      if (!state || !Array.isArray(state.board)) return false;

      board = state.board;
      playerRack = Array.isArray(state.playerRack) ? state.playerRack : [];
      cpuRack = Array.isArray(state.cpuRack) ? state.cpuRack : [];
      bag = Array.isArray(state.bag) ? state.bag : [];
      playerScore = state.playerScore || 0;
      cpuScore = state.cpuScore || 0;
      turn = (state.turn === 'cpu' || state.turn === 'none') ? state.turn : 'player';
      gameOver = !!state.gameOver;
      firstMoveDone = !!state.firstMoveDone;
      gems = typeof state.gems === 'number' ? state.gems : 123;
      pendingTiles = Array.isArray(state.pendingTiles) ? state.pendingTiles : [];
      swapMode = false;
      lastMove = state.lastMove || null;
      swapSelection = [];
      clearSelection();

        updateBagDisplay();
      updateScores();
      renderBoard();
      renderRack();
      updateTurnIndicator();

      if (gameOver) {
        headerMessageEl.textContent = 'Partita conclusa';
        syncUI();
      } else if (turn === 'cpu') {
        // La partita era stata chiusa mentre toccava alla CPU: le facciamo
        // giocare la mossa che aveva in sospeso.
        isCpuThinking = true;
        syncUI();
        setTimeout(cpuMove, 900);
      } else {
        syncUI();
        showNotification('Partita ripresa da dove l\'avevi lasciata.', 1800);
      }
      return true;
    } catch (err) {
      console.warn('Impossibile ripristinare la partita salvata:', err);
      return false;
    }
  }

  function newGame() {
    lastMove = null;
    board = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
    bag = createBag();
    playerRack = [];
    cpuRack = [];
    drawTiles(playerRack, 7);
    drawTiles(cpuRack, 7);
    playerScore = 0;

  // Ritaglio: si trascina/pizzica la foto per centrarla nel cerchio, poi OK.
  function mpOpenCropper(fileObj) {
    const url = URL.createObjectURL(fileObj);
    const img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); showNotification('Non riesco a leggere questa immagine.', 2500); };
    img.onload = () => {
      const S = 280, D = 260, M = 10, OUT = 192;
      const iw = img.naturalWidth, ih = img.naturalHeight;
      if (!iw || !ih) { URL.revokeObjectURL(url); showNotification('Immagine non valida.', 2500); return; }
      openModal('<div class="modal-header"><div class="modal-back">‹</div>Centra la foto</div>' +
        '<div class="crop-wrap">' +
          '<div class="crop-stage" id="cropStage"><img id="cropImg" alt=""><div class="crop-mask"></div></div>' +
          '<input type="range" id="cropZoom" class="crop-zoom" min="1" max="4" step="0.01" value="1">' +
          '<div class="mp-note" style="text-align:center;">Trascina la foto per spostarla, pizzica o usa il cursore per ingrandire.</div>' +
          '<div class="mp-btn-row" style="width:100%;padding:0;"><button class="mp-btn ghost" id="cropCancel">Annulla</button><button class="mp-btn" id="cropOk">OK</button></div>' +
        '</div>', { drawer: true });
      const stage = document.getElementById('cropStage');
      const im = document.getElementById('cropImg');
      const slider = document.getElementById('cropZoom');
      im.src = url; im.style.width = iw + 'px'; im.style.height = ih + 'px';
      const minScale = D / Math.min(iw, ih);
      let z = 1, scale = minScale, px = 0, py = 0;
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      function apply() {
        px = clamp(px, M + D - iw * scale, M);        // la foto deve sempre coprire il cerchio
        py = clamp(py, M + D - ih * scale, M);
        im.style.transform = 'translate(' + px + 'px,' + py + 'px) scale(' + scale + ')';
      }
      function setZoom(nz, cx, cy) {
        cx = cx == null ? S / 2 : cx; cy = cy == null ? S / 2 : cy;
        z = clamp(nz, 1, 4);
        const ns = minScale * z;
        px = cx - (cx - px) * (ns / scale);
        py = cy - (cy - py) * (ns / scale);
        scale = ns; slider.value = z; apply();
      }
      px = S / 2 - iw * scale / 2; py = S / 2 - ih * scale / 2; apply();
      slider.addEventListener('input', () => setZoom(parseFloat(slider.value)));
      stage.addEventListener('wheel', (e) => { e.preventDefault(); setZoom(z * (e.deltaY < 0 ? 1.08 : 0.93)); }, { passive: false });
      const ptrs = new Map(); let lastDist = 0;
      stage.addEventListener('pointerdown', (e) => {
        try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignora */ }
        ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); lastDist = 0;
      });
      stage.addEventListener('pointermove', (e) => {
        const p = ptrs.get(e.pointerId);
        if (!p) return;
        if (ptrs.size === 1) { px += e.clientX - p.x; py += e.clientY - p.y; apply(); }
        p.x = e.clientX; p.y = e.clientY;
        if (ptrs.size === 2) {
          const [a, b] = [...ptrs.values()];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          const r = stage.getBoundingClientRect();
          if (lastDist) setZoom(z * dist / lastDist, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
          lastDist = dist;
        }
      });
      const endPtr = (e) => { ptrs.delete(e.pointerId); lastDist = 0; };
      stage.addEventListener('pointerup', endPtr);
      stage.addEventListener('pointercancel', endPtr);
      const back = () => { URL.revokeObjectURL(url); mpOpenAvatar(); };
      modalSheet.querySelector('.modal-back').addEventListener('click', back);
      document.getElementById('cropCancel').addEventListener('click', back);
      document.getElementById('cropOk').addEventListener('click', () => {
        const cv = document.createElement('canvas');
        cv.width = cv.height = OUT;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, OUT, OUT);
        ctx.drawImage(img, (M - px) / scale, (M - py) / scale, D / scale, D / scale, 0, 0, OUT, OUT);
        const dataUrl = cv.toDataURL('image/jpeg', 0.85);
        URL.revokeObjectURL(url);
        mpSaveAvatar(dataUrl);
        mpOpenAvatar();
      });
    };
    img.src = url;
  }

  function mpHistRecord(games) {
    let list = mpHistLoad(), changed = false;
    for (const [id, g] of Object.entries(games)) {
      if (g.status !== 'finished' || !g.players || g.players.length < 2 || !g.names || !g.scores) continue;
      const slot = g.players.indexOf(mp.uid);
      if (slot < 0) continue;
      const opp = 1 - slot;
      const entry = {
        id, me: g.names[slot] || mp.nick || 'Tu', opp: g.names[opp] || 'Avversario',
        s: [g.scores[slot] | 0, g.scores[opp] | 0],
        r: g.winnerUid ? (g.winnerUid === mp.uid ? 'w' : 'l') : 'd',
        end: g.endReason || '', t: g.updatedMs || Date.now()
      };
      const i = list.findIndex(x => x.id === id);
      if (i < 0) { list.push(entry); changed = true; }
      else if (JSON.stringify(list[i]) !== JSON.stringify(entry)) { list[i] = entry; changed = true; }
    }
    if (changed) {
      list.sort((a, b) => b.t - a.t);
      list = list.slice(0, 300);
      try { localStorage.setItem(MP_HIST_KEY, JSON.stringify(list)); } catch (e) { /* ignora */ }
    }
  }
  function mpOpenGamesHistory() {
    mpMenuOpen = false;
    const list = mpHistLoad().sort((a, b) => b.t - a.t);
    const w = list.filter(x => x.r === 'w').length, l = list.filter(x => x.r === 'l').length, d = list.filter(x => x.r === 'd').length;
    const rows = list.length ? '<div class="mp-hist-sum">Vinte ' + w + ' · Perse ' + l + ' · Pari ' + d + '</div>' + list.map(x =>
      '<div class="mp-hist-row"><span class="n mp-res ' + x.r + '">' + (x.r === 'w' ? 'V' : x.r === 'l' ? 'P' : '=') + '</span>' +
      '<span class="tx">' + esc(x.me) + ' ' + x.s[0] + ' – ' + x.s[1] + ' ' + esc(x.opp) + (x.end === 'resign' ? ' <small>· resa</small>' : '') + '</span>' +
      '<span class="ago">' + mpAgo(x.t) + '</span></div>').join('')
      : '<div class="howto-body">Nessuna partita conclusa ancora.</div>';
    openModal('<div class="modal-header"><div class="modal-back">‹</div>Cronologia partite</div>' + rows, { drawer: true });
    modalSheet.querySelector('.modal-back').addEventListener('click', mpOpenMenu);
  }

  // ---------- menu ----------
  function mpSwitchRow(m, icon, bg, label, sub, on, disabled) {
    return '<div class="modal-option' + (disabled ? ' disabled' : '') + '" data-m="' + m + '">' +
      '<div class="modal-option-icon" style="background:' + bg + ';">' + icon + '</div>' +
      '<div style="flex:1;min-width:0;">' + label + (sub ? '<div class="mp-opt-sub">' + sub + '</div>' : '') + '</div>' +
      '<div class="mp-switch' + (on ? ' on' : '') + '"></div></div>';
  }
  function mpRefreshAfterPush() {
    if (mp.screen === 'home') mpRenderHome();
    if (mpMenuOpen) mpOpenMenu();
  }
  function mpOpenMenu() {
    const canVib = !!navigator.vibrate;
    let pushDis = false, pushSub = '';
    if (!PUSH_ENABLED || !pushSupported()) { pushDis = true; pushSub = 'Non disponibili su questo dispositivo'; }
    else if (pushIosNeedsInstall()) { pushDis = true; pushSub = 'Su iPhone: Condividi → Aggiungi alla schermata Home'; }
    else if (Notification.permission === 'denied') { pushDis = true; pushSub = 'Bloccate: riattivale dalle impostazioni del browser'; }
    openModal('<div class="modal-header">Menu</div>' +
      mpSwitchRow('vib', '📳', '#7e57c2', 'Vibrazione', canVib ? '' : 'Non supportata da questo dispositivo', canVib && hapticsOn(), !canVib) +
      mpSwitchRow('push', '🔔', '#f5a623', 'Notifiche', pushSub, !!mp.pushOn && !pushDis, pushDis) +
      '<div class="modal-option" data-m="hist"><div class="modal-option-icon" style="background:#26a69a;">📜</div><div style="flex:1;">Cronologia partite</div><div class="mp-chev">›</div></div>' +
      '<div class="modal-option" data-m="avatar"><div class="modal-option-icon" style="background:#2196f3;">🙂</div><div style="flex:1;">Avatar</div><div class="mp-av mini" data-avuid="' + esc(mp.uid || '') + '">👤</div></div>', { drawer: true });
    mpMenuOpen = true;
    mpApplyAvatars();
    modalSheet.querySelectorAll('[data-m]').forEach(el => el.addEventListener('click', () => {
      const m = el.dataset.m;
      if (el.classList.contains('disabled')) {
        showNotification(m === 'vib' ? 'La vibrazione non è supportata da questo dispositivo.' : (pushSub || 'Notifiche non disponibili.'), 3000);
        return;
      }
      if (m === 'vib') { setHaptics(!hapticsOn()); if (hapticsOn()) haptic(25); mpOpenMenu(); }
      else if (m === 'push') {
        if (!mp.uid) { showNotification('Serve la connessione per cambiare le notifiche.', 2500); return; }
        mpRun(mp.pushOn ? pushDisable : pushEnable);
      }
      else if (m === 'hist') mpOpenGamesHistory();
      else if (m === 'avatar') mpOpenAvatar();
    }));
  }

  // Dopo una mossa: chiede al Worker di avvisare l'altro giocatore (senza aspettare la risposta).
  async function mpNotifyOpponent(gameId, kind) {
    if (!PUSH_ENABLED || !mp.auth || !mp.auth.currentUser) return;
    try {
      const token = await mp.auth.currentUser.getIdToken();
      await fetch(PUSH_WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ gameId, kind }),
        keepalive: true
      });
    } catch (err) { console.warn('Notifica non inviata:', err); }
  }

  // ---------- avvio ----------
  function mpBoot() {
    // Chiede al browser di non svuotare lo storage (identità anonima + partita CPU).
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* ignora */ }

    if (!MP_ENABLED) { openCpuGame(); return; }
    backBtn.style.display = '';

    // Link d'invito: ...index.html?join=CODICE
    try {
      const code = new URLSearchParams(location.search).get('join');
      if (code) {
        localStorage.setItem(MP_JOIN_KEY, code.trim().toUpperCase());
        history.replaceState(null, '', location.pathname);
      }
      const gid = new URLSearchParams(location.search).get('game');
      if (gid && /^[A-Za-z0-9]{10,40}$/.test(gid)) {
        mp.pendingOpen = gid;
        history.replaceState(null, '', location.pathname);
      }
    } catch (e) { /* ignora */ }

    mpStart();
  }

  async function mpStart() {
    mpShowScreen('loading', '<div class="mp-body"><div class="mp-note" style="margin-top:40vh;">Connessione…</div></div>');
    try {
      const user = await mpInit();
      mp.offline = false;
      let nick = '';
      try { nick = localStorage.getItem(MP_NICK_KEY) || ''; } catch (e) { /* ignora */ }
      if (user && !nick) nick = await mpFetchNick();
      if (user && nick) {
        mp.nick = nick;
        try { localStorage.setItem(MP_NICK_KEY, nick); } catch (e) { /* ignora */ }
        await mpAfterLogin();
      } else {
        mpShowNickScreen('');
      }
    } catch (err) {
      console.warn('Multiplayer non disponibile:', err);
      mp.offline = true;
      mpShowHome();
    }
  }

  async function mpAfterLogin() {
    mpSubscribeList();
    mpShowHome();
    let code = null;
    try { code = localStorage.getItem(MP_JOIN_KEY); localStorage.removeItem(MP_JOIN_KEY); } catch (e) { /* ignora */ }
    if (code) await mpRun(() => mpJoinByCode(code));
    else if (mp.pendingOpen) { const id = mp.pendingOpen; mp.pendingOpen = null; mpOpenGame(id); }
    pushRefresh();
    mpSyncMyAvatar();
  }

  async function mpSubmitNick(raw) {
    const nick = String(raw || '').trim().replace(/\s+/g, ' ').slice(0, 16);
    if (!nick) { mpShowNickScreen('Scrivi un nome.'); return; }
    try {
      if (!mp.uid) {
        const cred = await mp.FB.signInAnonymously(mp.auth);
        mp.uid = cred.user.uid;
      }
      try { await mp.FB.setDoc(mp.FB.doc(mp.db, 'users', mp.uid), { nickname: nick, updatedMs: Date.now() }, { merge: true }); } catch (e) { /* non bloccante */ }
      try { localStorage.setItem(MP_NICK_KEY, nick); } catch (e) { /* ignora */ }
      mp.nick = nick;
      await mpAfterLogin();
    } catch (err) {
      mpShowNickScreen(mpErrText(err), nick);
    }
  }

  function mpSubscribeList() {
    if (mp.unsubList) return;
    const FB = mp.FB;
    const q = FB.query(FB.collection(mp.db, 'games'), FB.where('players', 'array-contains', mp.uid));
    mp.unsubList = FB.onSnapshot(q, snap => {
      mp.listError = '';
      const games = {};
      snap.forEach(d => { games[d.id] = d.data(); });
      mp.games = games;
      mpHistRecord(games);
      if (mp.screen === 'home') mpRenderHome();
      if (mp.screen === 'invite' && mp.inviteId) {
        const g = mp.games[mp.inviteId];
        if (g && g.status !== 'waiting') {
          showNotification((g.names[1] || 'Lo sfidante') + ' ha accettato l\'invito!', 3500);
          mpShowHome();
        }
      }
    }, err => {
      console.warn('Elenco partite:', err);
      mp.listError = (err && err.code === 'permission-denied') ? 'Non riesco a leggere le partite in questo momento. Riprova tra poco.' : mpErrText(err);
      if (mp.screen === 'home') mpRenderHome();
    });
  }

  // ---------- schermate ----------
  const mpScreenEl = document.getElementById('mpScreen');

  function mpShowScreen(name, html) {
    if (gamePushed) { gamePushed = false; navBack('g'); }
    const changed = mp.screen !== name;
    mp.screen = name;
    mpScreenEl.classList.toggle('mp-anim', changed);   // l'animazione parte solo quando cambia schermata
    mpScreenEl.innerHTML = html;
    mpScreenEl.style.display = 'flex';
    mpScreenEl.scrollTop = 0;
  }

  // Home: uno swipe orizzontale (da destra a sinistra o viceversa, non dal bordo estremo dove Android
  // usa il gesto "indietro") apre il menu. Si chiude con swipe verso sinistra o toccando fuori.
  (function () {
    let sw = null;
    mpScreenEl.addEventListener('touchstart', (e) => {
      if (mp.screen !== 'home' || modalOverlay.style.display !== 'none' || e.touches.length !== 1) { sw = null; return; }
      const t = e.touches[0]; sw = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    mpScreenEl.addEventListener('touchend', (e) => {
      if (!sw) return;
      const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, W = window.innerWidth;
      const okStart = sw.x > 24 && sw.x < W - 24;
      sw = null;
      if (okStart && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) { haptic(10); mpOpenMenu(); }
    }, { passive: true });
  })();

  function mpHideScreen() {
    if (!gamePushed) { gamePushed = true; navPush('g'); }      // il gesto "indietro" ora riporta alla home
    mp.screen = null;
    mpScreenEl.style.display = 'none';
    mpScreenEl.innerHTML = '';
  }

        '<button class="mp-me-btn" data-act="avatar" aria-label="Avatar" data-avuid="' + esc(mp.uid || '') + '">👤</button>'
      : '';
    return '<div class="mp-top' + (home ? ' home' : '') + '">' + menu + '<div class="t1">SCRABBLE</div><div class="t2">' + esc(sub) + '</div></div>';
  }

      <div class="mp-body">

  function mpShowInvite(gameId, code) {
    mp.inviteId = gameId;

    mpShowScreen('invite', mpTopHtml('Invita qualcuno') + `
      <div class="mp-body">

      </div>`);
