  function mpShowHome() {
    mpOpenAnimAbort();
    mpCloseGameListener();
    closeModal();
    mp.inviteId = null;
    mpRenderHome();
  }

  function mpCpuSummary() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return 'Nuova partita';
      const s = JSON.parse(raw);
      if (!s || !Array.isArray(s.board)) return 'Nuova partita';
      return (s.gameOver ? 'Conclusa · ' : 'In corso · ') + 'Tu ' + (s.playerScore || 0) + ' – CPU ' + (s.cpuScore || 0);
    } catch (e) { return 'Nuova partita'; }
  }

  // ---------- nuova home ----------
  function mpTilesHtml(word, pts) {
    const letters = [...String(word || '').toUpperCase()].slice(0, 15);
    const t = letters.map(ch => '<span class="mt">' + esc(ch) + '<sub>' + (LETTER_VALUES[ch] || 0) + '</sub></span>').join('');
    return '<div class="tw" style="--n:' + letters.length + '">' + t + '<span class="mp-pts">+' + pts + '</span></div>';
  }

  // Ultima mossa di una partita: parola in tessere (se c'è), didascalia e "quanto tempo fa".
  function mpLastInfo(g, slot) {
    const moves = g.moves || [], last = moves[moves.length - 1];
    if (!last) return { tiles: '', cap: 'Partita appena iniziata', ago: '' };
    const mine = last.by === slot, who = mine ? '' : (g.names[last.by] || 'Avversario');
    if (last.type === 'word' && (last.words || [])[0]) {
      return { tiles: mpTilesHtml(last.words[0], last.score), cap: mine ? 'La tua ultima parola' : 'L\'ultima parola di ' + esc(who), ago: mpAgo(last.t) };
    }
    return { tiles: '', cap: esc(mpMoveText(g, last, slot)), ago: mpAgo(last.t) };
  }

  function mpHeroHtml(id, g) {
    const slot = g.players.indexOf(mp.uid), opp = 1 - slot;
    const my = g.scores[slot], th = g.scores[opp], info = mpLastInfo(g, slot);
    const iLead = my >= th;
    return '<section class="mp-hero" data-act="open" data-id="' + esc(id) + '">' +
      '<div class="h-top"><span class="h-tag">Tocca a te</span><span class="h-ago">' + info.ago + '</span></div>' +
      '<div class="h-vs">' +
        '<div class="h-who"><span class="mp-av h-av" data-avuid="' + esc(mp.uid || '') + '">👤</span><span class="h-nm">Tu</span></div>' +
        '<div class="h-nums"><span class="' + (iLead ? 'big' : 'sm') + '">' + my + '</span><span class="dash">–</span><span class="' + (iLead ? 'sm' : 'big') + '">' + th + '</span></div>' +
        '<div class="h-who"><span class="mp-av h-av" data-avuid="' + esc(g.players[opp] || '') + '">🙂</span><span class="h-nm">' + esc(g.names[opp] || 'Avversario') + '</span></div>' +
      '</div>' +
      '<div class="h-last"><span class="cap">' + info.cap + '</span>' + info.tiles + '</div>' +
      '<button class="h-go" data-act="open" data-id="' + esc(id) + '">Gioca</button></section>';
  }

  function mpGameRow(id, g) {
    const slot = g.players.indexOf(mp.uid), opp = 1 - slot;
    if (g.status === 'waiting') {
      return '<div class="g-row" data-act="open" data-id="' + esc(id) + '">' +
        '<div class="g-ico dash"><svg viewBox="0 0 24 24"><path d="M7 3h10M7 21h10"/><path d="M8 3c0 5 4 6 4 9s-4 4-4 9M16 3c0 5-4 6-4 9s4 4 4 9"/></svg></div>' +
        '<div class="g-main"><div class="who">In attesa di uno sfidante</div><div class="g-last" style="font-size:0.85rem">Codice ' + esc(g.code || '') + '</div></div>' +
        '<button class="g-cancel" data-act="del" data-id="' + esc(id) + '">Annulla</button></div>';
    }
    const info = mpLastInfo(g, slot), name = esc(g.names[opp] || 'Avversario');
    let badge, cls = '';
    if (g.status === 'finished') { badge = g.winnerUid === mp.uid ? 'Vinta' : (g.winnerUid ? 'Persa' : 'Pari'); cls = 'done'; }
    else if (g.turnUid === mp.uid) badge = 'Tocca a te';
    else { badge = 'Tocca a ' + name; cls = 'wait'; }
    const extra = info.tiles || ('<div class="g-last">' + info.cap + '</div>');
    const del = g.status === 'finished'
      ? '<button class="mp-del" data-act="del" data-id="' + esc(id) + '" title="Elimina partita">✕</button>' : '';
    return '<div class="g-row" data-act="open" data-id="' + esc(id) + '">' +
      '<span class="mp-av g-av" data-avuid="' + esc(g.players[opp] || '') + '">🙂</span>' +
      '<div class="g-main"><div class="who">' + name + '</div>' +
        '<div class="g-sc">Tu <b>' + g.scores[slot] + '</b> – <b>' + g.scores[opp] + '</b> ' + name + (g.rematchGameId ? ' · rivincita creata' : '') + '</div>' + extra + '</div>' +
      '<div class="g-r"><div class="mp-badge ' + cls + '">' + badge + '</div>' + (info.ago ? '<span class="g-ago">' + info.ago + '</span>' : '') + '</div>' + del + '</div>';
  }

  function mpCpuRow() {
    return '<div class="g-row" data-act="cpu">' +
      '<div class="g-ico"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></div>' +
      '<div class="g-main"><div class="who">Partita contro la CPU</div><div class="g-sc">' + esc(mpCpuSummary()) + '</div></div>' +
      '<div class="mp-badge">Gioca</div></div>';
  }

  function mpRenderHome() {
    const mine = [], theirs = [], waiting = [], done = [];
    for (const [id, g] of Object.entries(mp.games)) {
      if (g.status === 'waiting') waiting.push([id, g]);
      else if (g.status === 'finished') done.push([id, g]);
      else if (g.turnUid === mp.uid) mine.push([id, g]);
      else theirs.push([id, g]);
    }
    const byRecent = (a, b) => (b[1].updatedMs || 0) - (a[1].updatedMs || 0);
    [mine, theirs, waiting, done].forEach(l => l.sort(byRecent));
    const online = !(mp.offline || !mp.uid);
    const hero = online && mine.length ? mine[0] : null;
    const others = (online ? [...mine.slice(hero ? 1 : 0), ...theirs, ...waiting] : []);

    let body = '';
    if (!online) {
      body += '<div class="mp-error" style="margin:16px">Il multiplayer non è disponibile (sei offline?).</div>' +
              '<div style="padding:0 16px"><button class="mp-btn" style="width:100%" data-act="retry">Riprova</button></div>';
    } else {
      if (mp.listError) body += '<div class="mp-error" style="margin:16px">' + esc(mp.listError) + '</div>';
      if (hero) body += mpHeroHtml(hero[0], hero[1]);
      else if (!mp.listError) body += '<div class="mp-note" style="margin:22px 24px 0">' +
        (done.length || others.length ? 'Nessuna partita aspetta una tua mossa.' : 'Nessuna partita online per ora. Creane una e manda il link su WhatsApp!') + '</div>';
    }
    body += '<div class="mp-label">' + (hero ? 'Altre partite' : 'Le tue partite') + '</div>' +
      '<div class="mp-list">' + others.map(([id, g]) => mpGameRow(id, g)).join('') + mpCpuRow() + '</div>';
    if (online && done.length) {
      body += '<div class="mp-label">Concluse</div><div class="mp-list">' + done.slice(0, 15).map(([id, g]) => mpGameRow(id, g)).join('') + '</div>';
    }

    const dock = online
      ? '<div class="mp-dock"><button class="mp-btn" data-act="new">Nuova partita</button><button class="mp-btn ghost" data-act="join">Codice invito</button></div>' : '';
    mpShowScreen('home', mpTopHtml('deipovery', true) + '<div class="mp-body home">' + body + '</div>' + dock);
    mpApplyAvatars();
    mpEnsureAvatars(Object.values(mp.games).filter(g => g.players && g.players.length === 2)
      .map(g => g.players[1 - g.players.indexOf(mp.uid)]));
  }

  // ---------- animazione "apri partita" ----------
  // La scheda toccata si allarga fino a riempire lo schermo (le foto volano nei riquadri dei punteggi),
  // poi la schermata di gioco compare: caselle dal centro verso i bordi, parole che cadono, rack che sale.
  let openAnim = null;
  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function mpAnimRel(el) {
    const a = document.getElementById('app').getBoundingClientRect(), r = el.getBoundingClientRect();
    return { l: r.left - a.left, t: r.top - a.top, w: r.width, h: r.height };
  }

  function mpOpenAnimStart(srcEl) {
    if (reduceMotion() || openAnim || mp.screen !== 'home' || !srcEl) return null;
    const card = srcEl.closest('.mp-hero, .g-row');
    if (!card) return null;
    const app = document.getElementById('app'), cr = mpAnimRel(card);
    const appBg = getComputedStyle(app).backgroundColor;
    const st = { grown: false, ready: false, curtain: null, flies: [], timer: null, id: null };

    const curtain = document.createElement('div');
    curtain.className = 'open-curtain';
    Object.assign(curtain.style, { left: cr.l + 'px', top: cr.t + 'px', width: cr.w + 'px', height: cr.h + 'px', borderRadius: '20px' });
    app.appendChild(curtain);
    st.curtain = curtain;
    const A = app.getBoundingClientRect();
    curtain.animate([
      { left: cr.l + 'px', top: cr.t + 'px', width: cr.w + 'px', height: cr.h + 'px', borderRadius: '20px', backgroundColor: '#fff' },
      { left: '0px', top: '0px', width: A.width + 'px', height: A.height + 'px', borderRadius: '0px', backgroundColor: '#fff', offset: 0.45 },
      { left: '0px', top: '0px', width: A.width + 'px', height: A.height + 'px', borderRadius: '0px', backgroundColor: appBg }
    ], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).onfinish = () => { st.grown = true; mpOpenAnimMaybeReveal(); };

    // foto che volano dalla scheda ai riquadri dei punteggi
    const pairs = [[card.querySelector('[data-avuid="' + (mp.uid || '') + '"]'), document.querySelector('.player-avatar')]];
    const opp = [...card.querySelectorAll('[data-avuid]')].find(e => e.dataset.avuid !== mp.uid);
    pairs.push([opp, document.getElementById('cpuAvatarEl')]);
    pairs.forEach(([src, dst], i) => {
      if (!src || !dst || !src.classList.contains('has-img')) return;
      const a = mpAnimRel(src), cs = getComputedStyle(src), f = document.createElement('div');
      f.className = 'open-fly';
      f.style.backgroundImage = cs.backgroundImage;
      Object.assign(f.style, { left: a.l + 'px', top: a.t + 'px', width: a.w + 'px', height: a.h + 'px', border: cs.borderTopWidth + ' solid ' + cs.borderTopColor });
      app.appendChild(f);
      st.flies.push({ el: f, dst, from: a, ring: [cs.borderTopWidth, cs.borderTopColor], i });
    });
    openAnim = st;
    return st;
  }

  // dopo che la scheda ha coperto lo schermo e la partita è pronta: scopre il gioco e avvia le entrate
  function mpOpenAnimMaybeReveal() {
    const st = openAnim;
    if (!st || !st.grown || !st.ready || st.revealed) return;
    st.revealed = true;
    clearTimeout(st.timer);
    const app = document.getElementById('app');
    if (mp.screen) mpHideScreen();
    // ritardi a onda: caselle dal centro, tessere riga per riga, rack una alla volta
    boardEl.querySelectorAll('.cell').forEach(c => {
      const r = +c.dataset.row, k = +c.dataset.col;
      c.style.setProperty('--d', c.classList.contains('occupied') ? r * 26 + k * 5 : Math.round(Math.hypot(r - 7, k - 7) * 16));
    });
    document.querySelectorAll('#rackSlots .rack-slot').forEach((s, k) => s.style.setProperty('--k', k));
    app.classList.add('stage-in');
    haptic([12, 40, 12]);
    st.flies.forEach(({ el, dst, from, ring }) => {
      const b = mpAnimRel(dst), cs = getComputedStyle(dst);
      el.animate([
        { left: from.l + 'px', top: from.t + 'px', width: from.w + 'px', height: from.h + 'px', borderColor: ring[1], borderWidth: ring[0] },
        { left: b.l + 'px', top: b.t + 'px', width: b.w + 'px', height: b.h + 'px', borderColor: cs.borderTopColor, borderWidth: cs.borderTopWidth }
      ], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
    });
    // la scheda si dissolve mentre le foto atterrano
    st.curtain.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, delay: 220, fill: 'forwards' }).onfinish = () => {
      st.curtain.remove(); st.flies.forEach(f => f.el.remove());
    };
    setTimeout(() => { app.classList.remove('stage-in'); }, 2200);
    openAnim = null;
  }

  function mpOpenAnimReady() { if (openAnim) { openAnim.ready = true; mpOpenAnimMaybeReveal(); } }

  function mpOpenAnimAbort() {
    const st = openAnim; if (!st) return;
    clearTimeout(st.timer);
    st.curtain.remove(); st.flies.forEach(f => f.el.remove());
    openAnim = null;
  }

  function mpOpenCpuAnimated(srcEl) {
    const st = mpOpenAnimStart(srcEl);
    if (!st) { openCpuGame(); return; }
    st.timer = setTimeout(() => { mpOpenAnimAbort(); openCpuGame(); }, 1500);
    // il gioco CPU si carica quando la scheda ha coperto lo schermo
    const wait = setInterval(() => {
      if (!openAnim || openAnim !== st) { clearInterval(wait); return; }
      if (st.grown) { clearInterval(wait); openCpuGame(); st.ready = true; mpOpenAnimMaybeReveal(); }
    }, 30);
  }

  // Un solo gestore per tutti i pulsanti delle schermate (l'HTML viene rigenerato di continuo).
  mpScreenEl.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (act === 'cpu') mpOpenCpuAnimated(el);
    else if (act === 'open') mpOpenFromList(el.dataset.id, el);
    else if (act === 'new') mpRun(mpCreateGame);
    else if (act === 'join') mpShowJoinScreen();
    else if (act === 'joinGo') { const v = document.getElementById('mpCodeInput').value; mpRun(() => mpJoinByCode(v)); }
    else if (act === 'home') mpShowHome();
    else if (act === 'nick') { const v = document.getElementById('mpNickInput').value; mpRun(() => mpSubmitNick(v)); }
    else if (act === 'retry') mpStart();
    else if (act === 'del') { e.stopPropagation(); mpRun(() => mpDeleteGame(el.dataset.id)); }
    else if (act === 'closePopup') closeModal();
    else if (act === 'menu') mpOpenMenu();
    else if (act === 'avatar') mpOpenAvatar();
    else if (act === 'pushOn') mpRun(pushEnable);
    else if (act === 'pushOff') mpRun(pushDisable);
    else if (act === 'wa') {
      const text = 'Ti sfido a Scrabble! Apri il link per giocare: ' + el.dataset.link;
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    } else if (act === 'share') {
      const text = 'Ti sfido a Scrabble! Apri il link per giocare: ' + el.dataset.link;
      if (navigator.share) navigator.share({ text }).catch(() => {});
      else showNotification('Condivisione non supportata: usa "Copia il link".', 2500);
    } else if (act === 'copy') {
      const link = el.dataset.link;
      const done = () => showNotification('Link copiato!', 1500);
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done).catch(() => showNotification('Copia non riuscita: seleziona il link a mano.', 2500));
      else showNotification('Seleziona il link a mano per copiarlo.', 2500);
    }
  });
  mpScreenEl.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.id === 'mpNickInput') { const v = e.target.value; mpRun(() => mpSubmitNick(v)); }
    else if (e.target.id === 'mpCodeInput') { const v = e.target.value; mpRun(() => mpJoinByCode(v)); }
  });

  function mpOpenFromList(id, srcEl) {
    const g = mp.games[id];
    if (!g) return;
    if (g.status === 'waiting') mpShowInvite(id, g.code || '');
    else mpOpenGame(id, srcEl);
  }

  // ---------- creazione e accoppiamento ----------
  function mpNewGameData(players, names, status, startUid, code) {
    const bagArr = createBag();
    const r0 = [], r1 = [];
    while (r0.length < 7 && bagArr.length) r0.push(bagArr.pop());
    while (r1.length < 7 && bagArr.length) r1.push(bagArr.pop());
    const now = Date.now();
    return {
      players, names, status, code: code || null,
      board: '.'.repeat(BOARD_SIZE * BOARD_SIZE),
      racks: [r0.join(''), r1.join('')],
      bag: bagArr.join(''),
      scores: [0, 0],
      startUid, turnUid: startUid,
      firstMoveDone: false, scorelessTurns: 0,
      moves: [],
      version: status === 'active' ? 1 : 0,
      createdMs: now, updatedMs: now,
      winnerUid: null, endReason: null, penalties: [0, 0],
      rematchGameId: null, rematchSeen: {}
    };
  }

  async function mpCreateGame() {
    if (!navigator.onLine) { showNotification(mpErrText(mpErr('offline')), 3000); return; }
    const FB = mp.FB;
    try {
      for (let attempt = 0; attempt < 5; attempt++) {
        const code = mpRandomCode();
        const gameRef = FB.doc(FB.collection(mp.db, 'games'));
        const batch = FB.writeBatch(mp.db);
        batch.set(gameRef, mpNewGameData([mp.uid], [mp.nick, ''], 'waiting', mp.uid, code));
        // Se il codice esiste già, questo "set" diventa un update e le regole lo rifiutano: si riprova con un altro.
        batch.set(FB.doc(mp.db, 'invites', code), { gameId: gameRef.id, creatorUid: mp.uid, creatorName: mp.nick, createdMs: Date.now() });
        try {
          await batch.commit();
          mpShowInvite(gameRef.id, code);
          return;
        } catch (err) {
          if (err && err.code === 'permission-denied' && attempt < 4) continue;
          throw err;
        }
      }
    } catch (err) {
      showNotification(mpErrText(err), 3500);
    }
  }

  // Popup mostrato quando il codice non esiste (mai esistito o invito annullato dal creatore).
  function mpInvalidCodePopup() {
    openModal('<div class="modal-header">Codice non valido</div>' +
      '<div class="mp-note" style="padding:16px;">Questo codice non esiste più: la partita è stata annullata oppure il codice è sbagliato. Chiedi un nuovo invito a chi ti ha sfidato.</div>' +
      '<div class="mp-btn-row"><button class="mp-btn" data-act="closePopup">OK</button></div>');
  }

  async function mpJoinByCode(rawCode) {
    const code = String(rawCode || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { showNotification('Codice non valido.', 2000); return; }
    if (!navigator.onLine) { showNotification(mpErrText(mpErr('offline')), 3000); return; }
    const FB = mp.FB;
    try {
      const inv = await FB.getDoc(FB.doc(mp.db, 'invites', code));
      if (!inv.exists()) { mpInvalidCodePopup(); return; }
      const gameId = inv.data().gameId;
      const ref = FB.doc(mp.db, 'games', gameId);
      const res = await FB.runTransaction(mp.db, async (tx) => {
        const s = await tx.get(ref);
        if (!s.exists()) return { invalid: true };
        const d = s.data();
        if (d.players.includes(mp.uid)) return { id: gameId, joined: false };   // già dentro (es. il link è il tuo)
        if (d.status !== 'waiting' || d.players.length >= 2) return { error: 'Questa partita è già iniziata.' };
        tx.update(ref, {
          players: [d.players[0], mp.uid],
          names: [d.names[0], mp.nick],
          status: 'active',
          version: d.version + 1,
          updatedMs: Date.now()
        });
        return { id: gameId, joined: true };
      });
      if (res.invalid) { mpInvalidCodePopup(); return; }
      if (res.error) { showNotification(res.error, 3500); return; }
      if (res.joined) mpNotifyOpponent(res.id, 'join');
      mpOpenGame(res.id);
    } catch (err) {
      if (err && err.code === 'permission-denied') showNotification('Questa partita è già iniziata o è stata annullata.', 3500);
      else showNotification(mpErrText(err), 3500);
    }
  }

  // ---------- partita aperta ----------
  function mpCloseGameListener() {
    if (mp.unsubGame) { try { mp.unsubGame(); } catch (e) { /* ignora */ } mp.unsubGame = null; }
  }

  function openCpuGame() {
    mpCloseGameListener();
    closeModal();
    mpHideScreen();
    gameMode = 'cpu';
    mp.gameId = null; mp.game = null; mp.appliedVersion = -1;
    isCpuThinking = false;
    mpSetCpuUi();
    if (!loadSavedGame()) newGame();
  }

  function mpSetCpuUi() {
    playerNameEl.textContent = 'Tu';
    cpuNameEl.textContent = 'CPU';
    cpuAvatarEl.textContent = '🤖';
    mpSetGameAvatars(null);
    playBtn.textContent = 'Invia';
  }

  function mpGoHome() {
    if (swapMode) exitSwapMode();
    mpShowHome();
  }

  function mpOpenGame(id, srcEl) {
    mpCloseGameListener();
    closeModal();
    gameMode = 'mp';
    mp.gameId = id; mp.game = null; mp.appliedVersion = -1; mp.rematchPrompted = false; mp.animatedMoveN = 0;
    const g0 = mp.games[id];
    const anim = (srcEl && g0 && g0.status === 'active') ? mpOpenAnimStart(srcEl) : null;
    if (anim) {
      // se la partita non arriva in tempo, si ripiega sulla schermata "Carico…"
      anim.timer = setTimeout(() => {
        mpOpenAnimAbort();
        if (mp.screen === 'home') mpShowScreen('loading', '<div class="mp-body"><div class="mp-note" style="margin-top:40vh;">Carico la partita…</div></div>');
      }, 2500);
    } else {
      mpShowScreen('loading', '<div class="mp-body"><div class="mp-note" style="margin-top:40vh;">Carico la partita…</div></div>');
    }
    mp.unsubGame = mp.FB.onSnapshot(mp.FB.doc(mp.db, 'games', id), mpOnGameSnap, (err) => {
      console.warn('Partita:', err);
      mpCloseGameListener();
      showNotification(mpErrText(err), 3500);
      mpShowHome();
    });
  }

  function mpOnGameSnap(snap) {
    if (!snap.exists()) { mpCloseGameListener(); showNotification('Partita non trovata.', 2500); mpShowHome(); return; }
    const d = snap.data();
    if (!d.players.includes(mp.uid)) { mpCloseGameListener(); showNotification('Non fai parte di questa partita.', 2500); mpShowHome(); return; }
    if (d.status === 'waiting') { mpCloseGameListener(); mpShowInvite(snap.id, d.code || ''); return; }
    if (d.version < mp.appliedVersion) return;            // copia vecchia in cache: la ignoro
    if (mp.appliedVersion >= 0 && d.version > mp.appliedVersion && d.status === 'active' && d.turnUid === mp.uid) haptic([30, 60, 30]);   // ha mosso l'avversario
    mp.game = d;
    if (d.version !== mp.appliedVersion) mpApplyState(d);
    else if (gameOver) syncUI();                          // cambiato solo qualcosa come rematchGameId
  }

  // Riempie le variabili globali del gioco a partire dal documento remoto.
  function mpApplyState(d) {
    const firstApply = mp.appliedVersion < 0;
    if (swapMode) exitSwapMode();
    if (modalOverlay.style.display !== 'none') closeModal();

    const prevPlayerScore = playerScore, prevCpuScore = cpuScore;
    const oldRack = playerRack, oldPending = pendingTiles;
    let draftDropped = 0;
    const slot = d.players.indexOf(mp.uid), opp = 1 - slot;
    mp.game = d; mp.slot = slot; mp.oppName = d.names[opp] || 'Avversario'; mp.oppUid = d.players[opp];
    mp.appliedVersion = d.version;

    board = mpUnflatBoard(d.board);
    playerRack = Array.from(d.racks[slot]);
    cpuRack = Array.from(d.racks[opp]);      // dell'avversario: la UI ne mostra solo il numero
    bag = Array.from(d.bag);
    playerScore = d.scores[slot];
    cpuScore = d.scores[opp];
    firstMoveDone = !!d.firstMoveDone;
    gameOver = d.status === 'finished';
    pendingTiles = [];                        // la bozza resta solo locale
    // Se il mio rack non è cambiato (ha mosso l'avversario) conservo l'ordine locale del rack.
    // Qualunque mossa faccia l'avversario (parola, passo, cambio) tutte le tessere di prova tornano in mano. Dopo una mia mossa il rack cambia e si riparte pulito.
    if (!firstApply && (oldRack.length + oldPending.length) > 0) {
      const oldAll = oldRack.concat(oldPending.map(t => t.isBlank ? '★' : t.letter));
      if (oldAll.slice().sort().join('') === playerRack.slice().sort().join('')) {
        const dm = d.moves || [];
        const lastMv = dm[dm.length - 1];
        playerRack = oldRack.slice();
        if (lastMv && lastMv.by !== slot) {
          pendingTiles = oldPending.slice();
          draftDropped = recallDraftAfterOpponentWord();
        } else {
          pendingTiles = oldPending.filter(t => board[t.row][t.col] === null);
          for (const t of oldPending) if (board[t.row][t.col] !== null) playerRack.push(t.isBlank ? '★' : t.letter);
        }
      }
    }
    swapSelection = [];
    clearSelection();
    isCpuThinking = false;
    turn = gameOver ? 'none' : (d.turnUid === mp.uid ? 'player' : 'opponent');

    const moves = d.moves || [];
    const lastWord = [...moves].reverse().find(m => m.type === 'word');
    lastMove = lastWord ? {
      row: lastWord.tiles[lastWord.tiles.length - 1].r,
      col: lastWord.tiles[lastWord.tiles.length - 1].c,
      score: lastWord.score,
      cells: lastWord.tiles.map(t => [t.r, t.c]),
      mine: lastWord.by === slot
    } : null;

    playerNameEl.textContent = 'Tu';
    cpuNameEl.textContent = mp.oppName;
    cpuAvatarEl.textContent = '🙂';
    mpSetGameAvatars(mp.oppUid);
    playBtn.textContent = 'Invia';

    updateBagDisplay();
    updateScores();
    renderBoard();
    renderRack();
    updateTurnIndicator();
    if (mp.screen === 'loading') mpHideScreen();
    else if (openAnim) mpOpenAnimReady();

    // Anima solo una parola davvero nuova (non il primo caricamento della partita, e non
    // un aggiornamento che non aggiunge una mossa, come "rivincita creata").
    let animMove = null;
    if (!firstApply && moves.length > (mp.animatedMoveN || 0)) {
      const mv = moves[moves.length - 1];
      if (mv.type === 'word') animMove = mv;
    }
    mp.animatedMoveN = moves.length;

    const finishUp = () => {
      if (gameOver) {
        mpShowResult(d);
      } else {
        syncUI();
        const last = moves[moves.length - 1];
        if (last && last.by !== slot) {
          showNotification(mpMoveText(d, last, slot) + (firstApply ? ' · ' + mpAgo(last.t) : '') + (draftDropped ? ' · le tue tessere sono tornate in mano' : ''), 3500);
        }
      }
    };

    if (animMove) {
      const mine = animMove.by === slot;
      const scoreEl = mine ? playerScoreEl : cpuScoreEl;
      const startScore = mine ? prevPlayerScore : prevCpuScore;
      scoreEl.textContent = startScore;
      const cellsWithLetters = animMove.tiles.map(t => ({ row: t.r, col: t.c, letter: t.l }));
      animateWordSubmit(cellsWithLetters, animMove.score, scoreEl, startScore, finishUp);
    } else {
      finishUp();
    }
  }

  function mpMoveText(g, mv, slot) {
    const who = mv.by === slot ? 'Tu' : (g.names[mv.by] || 'Avversario');
    if (mv.type === 'word') return who + ': ' + (mv.words || []).join(', ') + ' · +' + mv.score;
    if (mv.type === 'pass') return who + ': passa';
    if (mv.type === 'swap') return who + ': cambia ' + mv.count + (mv.count === 1 ? ' tessera' : ' tessere');
    if (mv.type === 'resign') return who + ': si arrende';
    return '';
  }

  function mpYourTurnText() {
    const g = mp.game, moves = (g && g.moves) || [];
    const last = moves[moves.length - 1];
    return last ? mpMoveText(g, last, mp.slot) + ' · tocca a te' : 'Tocca a te: inizia la partita!';
  }

  function mpWaitingText() {

    const last = moves[moves.length - 1];
    return last ? mpMoveText(g, last, mp.slot) + ' · tocca a ' + mp.oppName : 'Tocca a ' + mp.oppName;
  }

    playBtn.disabled = false;

  function mpShowResult(d) {

    let outcome;
    if (d.winnerUid === mp.uid) outcome = 'Hai vinto! 🎉';
    else if (d.winnerUid) outcome = mp.oppName + ' vince.';

  function mpMarkRematchSeen() {
    try {
      mp.FB.updateDoc(mp.FB.doc(mp.db, 'games', mp.gameId), { ['rematchSeen.' + mp.uid]: true }).catch(() => {});
    } catch (e) { /* ignora */ }
  }

  function mpOpenRematchPopup(d, outcome) {
    const slot = mp.slot, opp = 1 - slot;
    const reasons = { empty: 'Tessere finite.', passes: 'Troppi turni senza punti.', resign: 'Resa.' };
    let extra = reasons[d.endReason] || '';
    if (d.endReason !== 'resign' && d.penalties && (d.penalties[0] || d.penalties[1])) {
      extra += ' Penalità tessere rimaste: tu −' + d.penalties[slot] + ', ' + esc(mp.oppName) + ' −' + d.penalties[opp] + '.';
    }
    openModal(`
      <div class="modal-header">Rivincita?</div>
      <div class="howto-body">
        <b>Tu ${d.scores[slot]} – ${d.scores[opp]} ${esc(mp.oppName)}</b><br>${esc(outcome)}<br>${extra}<br><br>
        Se accetti si crea subito una nuova partita e inizia chi ha perso.
      </div>
      <div class="mp-btn-row">
        <button class="mp-btn ghost" id="rmCancel">Annulla</button>
        <button class="mp-btn" id="rmOk">OK</button>
      </div>`);
    modalSheet.querySelector('#rmCancel').addEventListener('click', closeModal);
    modalSheet.querySelector('#rmOk').addEventListener('click', () => { closeModal(); mpRun(mpRematch); });
  }

  // ---------- mosse (ogni mossa è una transazione con controllo di versione) ----------
  function mpComputeNext(d, slot, action) {
    const opp = 1 - slot;
    const cells = d.board.split('');
    const racks = d.racks.map(s => Array.from(s));
    const bagArr = Array.from(d.bag);
    const scores = d.scores.slice();
    const moves = (d.moves || []).slice();
    let scoreless = d.scorelessTurns || 0;
    let firstDone = !!d.firstMoveDone;
    const mv = { n: moves.length + 1, by: slot, type: action.type, t: Date.now() };
    const draw = () => { while (racks[slot].length < 7 && bagArr.length) racks[slot].push(bagArr.pop()); };

    if (action.type === 'word') {
      for (const t of action.tiles) {
        const idx = t.row * BOARD_SIZE + t.col;
        if (cells[idx] !== '.') throw mpErr('stale');
        const need = t.isBlank ? '★' : t.letter;
        const ri = racks[slot].indexOf(need);
        if (ri < 0) throw mpErr('stale');
        racks[slot].splice(ri, 1);
        cells[idx] = t.letter;
      }
      draw();
      scores[slot] += action.score;
      scoreless = 0;
      firstDone = true;
      mv.words = action.words;
      mv.score = action.score;
      mv.tiles = action.tiles.map(t => ({ r: t.row, c: t.col, l: t.letter }));
    } else if (action.type === 'pass') {
      scoreless++;
    } else if (action.type === 'swap') {
      const out = [];
      for (const l of action.letters) {
        const ri = racks[slot].indexOf(l);
        if (ri < 0) throw mpErr('stale');
        out.push(racks[slot].splice(ri, 1)[0]);
      }
      if (bagArr.length < out.length) throw mpErr('bag');
      for (const l of out) bagArr.push(l);
      shuffleArray(bagArr);
      draw();
      scoreless++;
      mv.count = out.length;
    }
    moves.push(mv);

    let status = 'active', endReason = null, winnerUid = null, turnUid = d.players[opp];
    const penalties = [0, 0];
    if (action.type === 'resign') { status = 'finished'; endReason = 'resign'; winnerUid = d.players[opp]; }
    else if (action.type === 'word' && racks[slot].length === 0 && bagArr.length === 0) { status = 'finished'; endReason = 'empty'; }
    else if (scoreless >= MP_PASS_LIMIT) { status = 'finished'; endReason = 'passes'; }

    if (status === 'finished') {
      turnUid = null;
      if (endReason !== 'resign') {
        // Penalità: ognuno perde il valore delle tessere che gli restano in mano.
        for (let i = 0; i < 2; i++) {
          penalties[i] = racks[i].reduce((sum, l) => sum + (LETTER_VALUES[l] || 0), 0);
          scores[i] -= penalties[i];
        }
        winnerUid = scores[0] > scores[1] ? d.players[0] : (scores[1] > scores[0] ? d.players[1] : null);
      }
    }

    return {
      board: cells.join(''), racks: racks.map(r => r.join('')), bag: bagArr.join(''),
      scores, scorelessTurns: scoreless, firstMoveDone: firstDone, moves,
      version: d.version + 1, updatedMs: Date.now(),
      status, turnUid, endReason, winnerUid, penalties
    };
  }

  async function mpTxAction(action) {
    if (!navigator.onLine) throw mpErr('offline');
    const FB = mp.FB;
    const ref = FB.doc(mp.db, 'games', mp.gameId);
    const expected = mp.appliedVersion;
    const run = FB.runTransaction(mp.db, async (tx) => {
      const s = await tx.get(ref);
      if (!s.exists()) throw mpErr('gone');
      const d = s.data();
      const slot = d.players.indexOf(mp.uid);
      if (slot < 0) throw mpErr('gone');
      if (d.status !== 'active') throw mpErr('notactive');
      if (action.type !== 'resign') {
        if (d.version !== expected) throw mpErr('stale');   // l'altra persona ha mosso mentre eri sulla vecchia versione
        if (d.turnUid !== mp.uid) throw mpErr('notturn');
      }
      const upd = mpComputeNext(d, slot, action);
      tx.update(ref, upd);
      return Object.assign({}, d, upd);
    });
    const timeout = new Promise((_, rej) => setTimeout(() => rej(mpErr('timeout')), 20000));
    return Promise.race([run, timeout]);
  }

  // Durante l'invio riuso isCpuThinking come "occupato": blocca tocchi e drag.
  async function mpSend(action, okMessage) {
    isCpuThinking = true;
    headerMessageEl.textContent = 'Invio…';
    playBtn.disabled = true;
    skipBtn.disabled = true;
    try {
      const nd = await mpTxAction(action);
      // Il listener può aver già applicato questa versione prima che la transazione risponda: non applicarla due volte.
      if (nd.version > mp.appliedVersion) mpApplyState(nd);
      isCpuThinking = false;
      mpNotifyOpponent(mp.gameId, 'move');
      if (okMessage) showNotification(okMessage, 2500);
      return true;
    } catch (err) {
      isCpuThinking = false;
      showNotification(mpErrText(err), 3500);
      syncUI();
      return false;
    }
  }

  function mpSubmitWord(result) {
    const tiles = pendingTiles.map(t => ({ row: t.row, col: t.col, letter: t.letter, isBlank: !!t.isBlank }));
    return mpSend({ type: 'word', tiles, score: result.score, words: result.words },
      '+' + result.score + ' punti! ' + result.words.join(', '));
  }

  function mpSubmitPass() {
    return mpSend({ type: 'pass' }, 'Turno passato.');
  }

  async function mpSubmitSwap() {
    const letters = swapSelection.map(i => playerRack[i]);
    const ok = await mpSend({ type: 'swap', letters }, 'Hai cambiato ' + letters.length + ' tessere.');
    if (!ok && swapMode) syncUI();
  }

  async function mpResign() {
    if (!mp.game || mp.game.status !== 'active') return;
    if (!confirm('Vuoi arrenderti? La partita finirà e vincerà ' + mp.oppName + '.')) return;
    await mpSend({ type: 'resign' }, 'Ti sei arreso.');
  }

  // ---------- rivincita ----------
  function mpRematchStarter(d) {
    if (d.winnerUid) return d.players.find(u => u !== d.winnerUid);   // inizia chi ha perso
    return d.players.find(u => u !== d.startUid);                     // pareggio: inizia chi non aveva iniziato
  }

  async function mpRematch() {
    if (!mp.game || mp.game.status !== 'finished') return;
    if (!navigator.onLine) { showNotification(mpErrText(mpErr('offline')), 3000); return; }
    const FB = mp.FB;
    const oldRef = FB.doc(mp.db, 'games', mp.gameId);
    const newRef = FB.doc(FB.collection(mp.db, 'games'));
    try {
      let created = false;
      const newId = await FB.runTransaction(mp.db, async (tx) => {
        created = false;
        const s = await tx.get(oldRef);
        if (!s.exists()) throw mpErr('gone');
        const d = s.data();
        if (d.status !== 'finished') throw mpErr('notactive');
        if (d.rematchGameId) return d.rematchGameId;      // l'altra persona è arrivata prima: mi aggancio
        const slot = d.players.indexOf(mp.uid);
        const data = mpNewGameData([mp.uid, d.players[1 - slot]], [d.names[slot], d.names[1 - slot]], 'active', mpRematchStarter(d), null);
        tx.set(newRef, data);
        tx.update(oldRef, { rematchGameId: newRef.id });
        created = true;
        return newRef.id;
      });
      if (created) {
        mpNotifyOpponent(newId, 'rematch');
        try { await FB.deleteDoc(oldRef); } catch (e) { /* le regole potrebbero non essere ancora aggiornate: non bloccare la rivincita */ }
      }
      mpOpenGame(newId);
    } catch (err) {
      showNotification(mpErrText(err), 3500);
    }
  }

  // ---------- eliminare una partita ----------
  // - Conclusa (vinta, persa, pari o abbandonata): si elimina, così non resta per sempre in "Concluse".
  // - In attesa di uno sfidante: si annulla l'invito. Si cancellano partita + codice, quindi chi
  //   inserisce quel codice vede "Codice non valido". Se nel frattempo lo sfidante è entrato,
  //   l'annullamento viene rifiutato (la transazione lo controlla).
  // Richiede le regole Firestore aggiornate (firestore.rules) e ripubblicate.
  async function mpDeleteGame(id) {
    const g = mp.games[id];
    if (!g || (g.status !== 'finished' && g.status !== 'waiting')) return;
    const waiting = g.status === 'waiting';
    const msg = waiting
      ? 'Annullare questo invito? Il codice ' + (g.code || '') + ' non sarà più valido.'
      : 'Eliminare questa partita conclusa? Non si può annullare.';
    if (!confirm(msg)) return;
    if (!navigator.onLine) { showNotification(mpErrText(mpErr('offline')), 3000); return; }
    const FB = mp.FB;
    try {
      if (waiting) {
        const ref = FB.doc(mp.db, 'games', id);
        const res = await FB.runTransaction(mp.db, async (tx) => {
          const s = await tx.get(ref);
          if (!s.exists()) return { ok: true };                       // già sparita
          const d = s.data();
          if (d.status !== 'waiting' || d.players.length !== 1) return { taken: true };
          tx.delete(ref);
          if (d.code) tx.delete(FB.doc(mp.db, 'invites', d.code));
          return { ok: true };
        });
        if (res.taken) { showNotification('Nel frattempo è entrato uno sfidante: la partita è partita.', 3500); return; }
        showNotification('Invito annullato.', 2000);
        if (mp.screen === 'invite') mpShowHome();
      } else {
        await FB.deleteDoc(FB.doc(mp.db, 'games', id));
      }
    } catch (err) {
      const c = err && err.code;
      if (c === 'permission-denied' || c === 'not-found') showNotification('Questa partita è già stata eliminata.', 2500);
      else showNotification(mpErrText(err), 3500);
    }
  }

  // ---------- cronologia ----------
  function mpOpenHistory() {
    const g = mp.game;
    if (!g) return;
    const moves = (g.moves || []).slice().reverse();
    const rows = moves.length ? moves.map(m =>
      '<div class="mp-hist-row"><span class="n">#' + m.n + '</span><span class="tx">' + esc(mpMoveText(g, m, mp.slot)) +
      '</span><span class="ago">' + mpAgo(m.t) + '</span></div>').join('')
      : '<div class="howto-body">Nessuna mossa ancora.</div>';
    let footer = '';
    if (g.status === 'finished' && g.endReason !== 'resign' && g.penalties && (g.penalties[0] || g.penalties[1])) {
      const s = mp.slot;
      footer = '<div class="howto-body">Penalità tessere rimaste: tu −' + g.penalties[s] + ', ' + esc(mp.oppName) + ' −' + g.penalties[1 - s] + '.</div>';
    }
    openModal('<div class="modal-header">Cronologia mosse</div>' + rows + footer);
  }

  // ==================== EVENTI ====================
  playBtn.addEventListener('click', () => {
    if (gameMode === 'mp' && gameOver) { mpRun(mpRematch); return; }
    if (swapMode) confirmSwap(); else playerPlay();
  });
  backBtn.addEventListener('click', mpGoHome);
  skipBtn.addEventListener('click', () => { if (swapMode) exitSwapMode(); else skipTurn(); });
  recallBtn.addEventListener('click', recallAll);
  swapBtn.addEventListener('click', toggleSwapMode);
  document.getElementById('newGameBtn').addEventListener('click', newGame);
  shuffleBtnEl.addEventListener('click', () => {
    if (!canEditDraft() || swapMode) return;
    shuffleArray(playerRack);
    selectedTileIndex = -1;
    haptic([10, 30, 10]);
    renderRack();
    showNotification('Rack mescolato!', 1000);
  });

  document.getElementById('menuBtn').addEventListener('click', openOptionsModal);
  bagBtn.addEventListener('click', openBagModal);
  confirmSwapBtn.addEventListener('click', confirmSwap);
  swapCloseBtn.addEventListener('click', exitSwapMode);

  mpBoot();   // senza configurazione Firebase parte direttamente la partita CPU, come prima

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', (e) => {
      const m = e.data;
      if (!m || m.type !== 'openGame' || !/^[A-Za-z0-9]{10,40}$/.test(m.gameId || '')) return;
      if (mp.uid && mp.FB && mp.db) mpOpenGame(m.gameId);
      else mp.pendingOpen = m.gameId;
    });
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((registration) => {
        // Appena c'è un nuovo service worker installato e pronto, digli di
        // subentrare subito invece di aspettare che tutte le schede si chiudano.
        function activateNewWorker(worker) {
          if (!worker) return;
          worker.addEventListener('statechange', () => {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
              worker.postMessage('skipWaiting');
            }
          });
        }
        activateNewWorker(registration.installing);
        registration.addEventListener('updatefound', () => activateNewWorker(registration.installing));

        // Controlla periodicamente (e quando l'app torna in primo piano) se è
        // stato pubblicato un nuovo commit, senza aspettare una ricarica manuale.
        setInterval(() => registration.update().catch(() => {}), 60000);
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') registration.update().catch(() => {});
        });
      }).catch(err => {
        console.warn('Registrazione service worker fallita:', err);
      });

      // Quando il nuovo service worker prende il controllo della pagina, la
      // webapp si aggiorna da sola ricaricandosi (una sola volta).
      let refreshingAfterUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshingAfterUpdate) return;
        refreshingAfterUpdate = true;
        window.location.reload();
      });
    });
  }
</script>
