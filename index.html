<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SCRABBLEdeipovery</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4e9f5f">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SCRABBLEdeipovery">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      font-family: 'Roboto', 'Segoe UI', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { height: 100%; }

    body {
      background-color: #e8f0e6;
      min-height: 100vh;
      min-height: 100dvh;
      min-height: calc(var(--vh, 1vh) * 100);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      max-width: 500px;
      height: 100vh;
      height: 100dvh;
      height: calc(var(--vh, 1vh) * 100);
      max-height: 900px;
      display: flex;
      flex-direction: column;
      background: #d9edf8;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.3);
      overflow: hidden;
    }

    /* ========== HEADER ========== */
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px 8px;
      background: #4e9f5f;
      color: #fff;
      flex-shrink: 0;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    /* Pill "suggerimenti": lunga e incavata */
    .header-message {
      flex: 1;
      min-width: 0;
      display: block;
      height: 44px;
      line-height: 44px;
      padding: 0 18px;
      text-align: center;
      border-radius: 24px;
      background: #3a7d49;
      box-shadow: inset 0 3px 7px rgba(0,0,0,0.38), 0 1px 0 rgba(255,255,255,0.15);
      font-size: 0.92rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ========== PLAYER PANEL ========== */
    .player-panel {
      display: flex;
      gap: 8px;
      padding: 6px 14px 14px;
      background: #4e9f5f;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      box-shadow: 0 2px 0 rgba(0,0,0,0.12);
    }

    /* Profilo "spento" (di default) */
    .player-side {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      min-height: calc(80px + var(--xp, 0px));
      border-radius: 20px;
      background: rgba(0,0,0,0.16);
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.22);
      color: #fff;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
    }
    .player-side.cpu-side { flex-direction: row-reverse; }

    /* Profilo "acceso": chi sta giocando ora */
    .player-side.active {
      background: #f6e6e2;
      color: #2f2f2f;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }

    .player-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      line-height: 1.05;
      min-width: 0;
    }
    .cpu-side .player-info { align-items: flex-end; }

    .avatar {
      width: 54px;
      height: 54px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      overflow: hidden;
      position: relative;
      transition: opacity 0.25s;
    }
    .player-side:not(.active) .avatar { opacity: 0.8; }

    .avatar.player-avatar { background: linear-gradient(135deg, #4a90e2, #2c5aa0); color: #fff; }
    .avatar.cpu-avatar { background: linear-gradient(135deg, #f5a623, #d48a10); color: #fff; }

    .player-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: inherit;
      opacity: 0.92;
    }

    .player-score {
      font-size: 2rem;
      font-weight: 600;
      color: inherit;
      line-height: 1.1;
    }

    /* ========== STAGE: titolo + tabellone su fondo azzurro ========== */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: #d9edf8;
    }

    .title-area {
      flex-shrink: 0;
      text-align: center;
      padding: calc(16px + var(--xt, 0px)) 0 8px;
      line-height: 1;
      white-space: nowrap;
      color: #8fc6ea;
    }
    .title-main {
      font-size: clamp(1.3rem, 6.6vw, 2.1rem);
      font-weight: 900;
      letter-spacing: 0.38em;
      margin-right: -0.3em;
    }
    .title-sub {
      font-size: clamp(0.8rem, 3.9vw, 1.25rem);
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    /* ========== BOARD ========== */
    .board-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 8px 6px;
      background: transparent;
      min-height: 0;
      min-width: 0;
      position: relative;
      overflow: hidden;
    }

    .board-wrapper {
      background: #cfe6f4;
      padding: 4px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      /* dimensioni esatte impostate da fitBoard() (JS) per avere sempre celle quadrate */
      width: 100%;
      aspect-ratio: 1/1;
      flex: 0 0 auto;
      display: flex;
      min-width: 0;
      min-height: 0;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(15, 1fr);
      grid-template-rows: repeat(15, 1fr);
      gap: 2px;
      background: #f7fbfe;
      width: 100%;
      height: 100%;
      border-radius: 5px;
      overflow: hidden;
    }

    /* CELLA BASE - PIATTA, CON LEGGERO SQUIRCLE E STACCO BIANCO (come SCRABBLEdeipovery) */
    .cell {
      background: #e7e9f0;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.65rem;
      color: #333;
      position: relative;
      transition: background 0.15s;
      cursor: pointer;
      min-width: 0;
      min-height: 0;
      border: none;
      box-shadow: none;
      outline: none;
      text-align: center;
      line-height: 1;
      padding: 0;
      overflow: hidden;
    }

    /* Colori premium - PIATTI */
    .cell.tw { background: #e5185f; color: #fff; }
    .cell.dw { background: #f7896a; color: #fff; }
    .cell.tl { background: #1b6ea6; color: #fff; }
    .cell.dl { background: #80c8f0; color: #fff; }
    .cell.star { background: #e91e63; color: #fff; }

    /* Etichette premium ben visibili */
    .cell .premium-label {
      font-size: 0.55rem;
      font-weight: 900;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      opacity: 0.95;
      line-height: 1;
    }

    .cell.tw .premium-label,
    .cell.dw .premium-label,
    .cell.tl .premium-label,
    .cell.star .premium-label {
      color: #fff;
      text-shadow: 0 0 1px rgba(0,0,0,0.3);
    }

    .cell.dl .premium-label {
      color: #fff;
    }

    /* Tessera piazzata */
    .cell.occupied {
      background: #f5e6b8;
      color: #1a1a1a;
      font-weight: 800;
      font-size: calc(var(--cell, 24px) * 0.68);
      line-height: 1;
      padding: 0;
      border: 1px solid #d4c090;
      z-index: 5;
    }

    .cell.occupied .tile-points {
      position: absolute;
      bottom: calc(var(--cell, 24px) * 0.04);
      right: calc(var(--cell, 24px) * 0.07);
      font-size: calc(var(--cell, 24px) * 0.22);
      font-weight: 500;
      color: #222;
      line-height: 1;
    }

    /* Cella selezionata (tessera armata pronta da piazzare) */
    .cell.selected {
      outline: 3px solid #ffeb3b;
      outline-offset: -3px;
      z-index: 10;
    }

    /* Cella target durante il drag */
    .cell.drop-hover {
      outline: 3px dashed #2e7d32;
      outline-offset: -3px;
      background: #e8f5e0 !important;
      z-index: 12;
    }

    /* Tessera piazzata in questo turno ma non ancora confermata */
    .cell.pending {
      background: #fdf6d8;
      color: #1a1a1a;
      font-weight: 800;
      font-size: calc(var(--cell, 24px) * 0.68);
      line-height: 1;
      padding: 0;
      border: 1px solid #d4c090;
      z-index: 6;
    }

    .cell.pending .tile-points {
      position: absolute;
      bottom: calc(var(--cell, 24px) * 0.04);
      right: calc(var(--cell, 24px) * 0.07);
      font-size: calc(var(--cell, 24px) * 0.22);
      font-weight: 500;
      color: #222;
      line-height: 1;
    }

    /* Livello sopra il tabellone con cornici parola e badge punteggio */
    .board-wrapper { position: relative; }
    .board-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }
    .word-frame {
      position: absolute;
      box-sizing: border-box;
      border: 3px solid #2e9a1f;
      border-radius: 5px;
    }
    .word-frame.invalid { border-color: #c62828; }
    /* Misure prese dalla reference (in proporzione alla cella):
       rombo verde = lato 0.47 cella, centrato sull'angolo della cornice;
       pallino blu = diametro 0.65 cella, centrato sull'angolo basso-destra della parola. */
    .score-badge {
      position: absolute;
      width: calc(var(--cell, 24px) * 0.47);
      height: calc(var(--cell, 24px) * 0.47);
      background: #1f9a12;
      border: 0;
      border-radius: calc(var(--cell, 24px) * 0.05);
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .score-badge span {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-45deg);
      color: #fff;
      font-size: calc(var(--cell, 24px) * 0.34);
      font-weight: 500;
      letter-spacing: -0.02em;
    }
    /* Popup del rombo/pallino punteggio: appare con un piccolo rimbalzo invece che di scatto */
    @keyframes badgePop {
      0%   { transform: translate(-50%, -50%) rotate(45deg) scale(0.3); opacity: 0; }
      55%  { transform: translate(-50%, -50%) rotate(45deg) scale(1.22); opacity: 1; }
      100% { transform: translate(-50%, -50%) rotate(45deg) scale(1); opacity: 1; }
    }
    @keyframes badgePopRound {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      55%  { transform: translate(-50%, -50%) scale(1.28); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .score-badge.pop { animation: badgePop 0.34s cubic-bezier(.34,1.56,.64,1) both; }
    .last-move-badge.pop { animation: badgePopRound 0.34s cubic-bezier(.34,1.56,.64,1) both; }

    /* Lettera che "salta" al momento dell'invio, prima di volare verso il punteggio */
    @keyframes tilePop {
      0%   { transform: scale(1); box-shadow: none; }
      45%  { transform: scale(1.3); box-shadow: 0 0 0 5px rgba(255,235,59,0.55), 0 6px 10px rgba(0,0,0,0.3); }
      100% { transform: scale(1); box-shadow: none; }
    }
    .cell.pop-cell { animation: tilePop 0.4s cubic-bezier(.34,1.56,.64,1) both; z-index: 15; }

    /* Il resto del tabellone si affievolisce mentre la parola appena giocata risalta */
    .cell.dim-cell { filter: brightness(0.5) saturate(0.6); transition: filter 0.35s ease; }

    /* Tessera "volante" che porta i punti verso il totale in alto */
    .fly-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 600;
      overflow: visible;
    }
    .fly-tile {
      position: absolute;
      left: 0;
      top: 0;
      width: 30px;
      height: 30px;
      margin: -15px 0 0 -15px;
      background: linear-gradient(160deg, #fdf6d8, #f5e6b8);
      border: 1px solid #d4c090;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #1a1a1a;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
      will-change: transform, opacity;
    }

    /* Il riquadro del punteggio "batte" quando arrivano i punti */
    @keyframes scoreLand {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.24); }
      100% { transform: scale(1); }
    }
    .player-score.score-pulse { animation: scoreLand 0.32s cubic-bezier(.34,1.56,.64,1); display: inline-block; }

    .last-move-badge {
      position: absolute;
      width: calc(var(--cell, 24px) * 0.65);
      height: calc(var(--cell, 24px) * 0.65);
      padding: 0;
      box-sizing: border-box;
      background: #1a3cff;
      color: #fff;
      border: 0;
      border-radius: 50%;
      font-size: calc(var(--cell, 24px) * 0.34);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
    }

    /* Tessera "fantasma" che segue il dito durante il trascinamento (niente zoom di schermata) */
    .drag-ghost {
      position: fixed;
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: linear-gradient(180deg, #faf0d0 0%, #e8d8a8 100%);
      border: 2px solid #d4c090;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: #2d3e1f;
      box-shadow: 0 10px 22px rgba(0,0,0,0.45);
      pointer-events: none;
      z-index: 500;
      transform: translate(-50%, -50%) scale(1.1);
      opacity: 0.96;
    }

    .rack-slot.dragging-source {
      opacity: 0.25;
    }
    .rack-slot.rack-drop-hover {
      outline: 3px dashed #2e7d32;
      outline-offset: -3px;
      background: #e8f5e0;
    }

    .rack-slot.marked-swap {
      outline: 3px solid #e53935;
      outline-offset: 1px;
      box-shadow: 0 0 0 3px rgba(229,57,53,0.35), 0 6px 12px rgba(0,0,0,0.3);
      transform: translateY(-4px);
    }

    .bag-bar {
      background: rgba(0,0,0,0.12);
      color: #1a4a1a;
      font-size: 0.65rem;
      font-weight: 700;
      text-align: center;
      padding: 3px 0;
      flex-shrink: 0;
      letter-spacing: 0.2px;
    }

    .rack-slot.filled, .cell {
      touch-action: none;
    }

    /* Stella centrale - simbolo */
    .cell.star .premium-label {
      font-size: 0.9rem;
    }

    /* ========== RACK ========== */
    /* Le lettere "poggiano" sulla barra sotto: la sezione si sovrappone di 12px. */
    .rack-section {
      background: transparent;
      padding: calc(12px + var(--xr, 0px)) 8px 0;
      margin-bottom: -12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 8;
    }

    .rack-slots {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      width: 100%;
    }

    .rack-slot {
      width: 100%;
      aspect-ratio: 1/1;
      background: transparent;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.15s;
      cursor: pointer;
      min-width: 0;
      min-height: 0;
    }

    .rack-slot.filled {
      background: linear-gradient(180deg, #f9edcc 0%, #f0dcaa 100%);
      box-shadow: 0 3px 0 #d3bd85, 0 6px 10px rgba(0,0,0,0.25);
    }

    .rack-slot.selected-tile {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 0 0 3px #ffeb3b, 0 3px 0 #d3bd85, 0 10px 14px rgba(0,0,0,0.3);
      z-index: 15;
    }

    .rack-letter {
      font-size: clamp(1.5rem, 9vw, 2.4rem);
      font-weight: 600;
      color: #173a1b;
      line-height: 1;
    }

    .rack-points {
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: clamp(0.55rem, 2.6vw, 0.75rem);
      font-weight: 600;
      color: #173a1b;
      line-height: 1;
    }

    @supports (width: 1cqw) {
      .rack-slot { container-type: inline-size; }
      .rack-letter { font-size: 58cqw; }
      .rack-points { font-size: 20cqw; bottom: 6cqw; right: 8cqw; }
    }

    /* ========== BOTTOM BAR ========== */
    .bottom-bar {
      position: relative;
      z-index: 1;
      background: linear-gradient(180deg, #68b078 0%, #4f9c60 100%);
      border-top: 2px solid rgba(255,255,255,0.28);
      padding: 26px 14px calc(18px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Icone: solo bianche, senza cerchio */
    .icon-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.1s, transform 0.1s;
    }
    .icon-btn svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .icon-btn:active { transform: scale(0.88); opacity: 0.7; }

    /* X per uscire dal cambio tessere (nella pill in alto) */
    .icon-btn.small-close {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0,0,0,0.25);
      font-size: 0.95rem;
      font-weight: 900;
    }
    .icon-btn.small-close svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: #fff;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .invia-btn, .scambia-btn {
      flex: 1;
      height: 46px;
      border-radius: 30px;
      background: rgba(255,255,255,0.2);
      border: 3px solid #fff;
      font-weight: 500;
      font-size: 1.2rem;
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.1s, transform 0.08s, background 0.15s;
    }
    .invia-btn:active, .scambia-btn:active { transform: scale(0.97); }
    .invia-btn:disabled { opacity: 0.6; pointer-events: none; background: rgba(255,255,255,0.1); }
    .scambia-btn { font-size: 1.05rem; }

    /* Sacchetto: icona bianca con il numero dentro */
    .bag-btn {
      position: relative;
      width: 46px;
      height: 50px;
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.1s, transform 0.1s;
    }
    .bag-btn:active { transform: scale(0.92); opacity: 0.75; }
    .bag-btn svg { width: 100%; height: 100%; fill: #fff; }
    .bag-btn span {
      position: absolute;
      left: 0; right: 0;
      top: 64%;
      transform: translateY(-50%);
      text-align: center;
      font-weight: 800;
      font-size: 0.8rem;
      color: #4a9a5b;
      line-height: 1;
    }

    @media (max-height: 700px) {
      .header { padding-top: 8px; }
      .player-side { min-height: calc(64px + var(--xp, 0px)); }
      .avatar { width: 46px; height: 46px; }
      .player-score { font-size: 1.7rem; }
      .title-area { padding: 8px 0 4px; }
      .bottom-bar { padding-top: 22px; padding-bottom: 12px; }
    }

    /* ========== MODALI ========== */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
    }

    .modal-sheet {
      background: #fff;
      width: 100%;
      max-height: 82%;
      overflow-y: auto;
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.4);
    }

    .modal-header {
      background: #4e9f5f;
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
    }

    .modal-header .modal-x {
      position: absolute;
      right: 14px;
      top: 10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-option {
      display: flex;
      align-items: center;
      gap: 14px;

    .stage-in .rack-slot.filled { animation: rackUp 0.5s cubic-bezier(0.2, 1.3, 0.4, 1) both; animation-delay: calc(var(--k, 0) * 70ms + 640ms); }
    @keyframes gFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cellIn { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: none; } }
    @keyframes tileDrop { from { opacity: 0; transform: translateY(-14px) scale(1.25); } to { opacity: 1; transform: none; } }
    @keyframes rackUp { from { opacity: 0; transform: translateY(70px) rotate(-8deg); } to { opacity: 1; transform: none; } }
</style>

  // quindi misuriamo noi window.innerHeight (che tiene conto di barre indirizzo/nav

  function setRealViewportHeight() {
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setRealViewportHeight();
  window.addEventListener('resize', setRealViewportHeight);
  window.addEventListener('orientationchange', () => setTimeout(setRealViewportHeight, 100));

  // Tabellone sempre QUADRATO: prende il lato massimo disponibile (min tra larghezza e
  // altezza dell'area centrale) e lo arrotonda in modo che le 15x15 celle siano intere.
  function fitBoard() {
    const sec = document.querySelector('.board-section');
    const wrap = document.querySelector('.board-wrapper');
    if (!sec || !wrap) return;
    const cs = getComputedStyle(sec);
    const availW = sec.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = sec.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const avail = Math.min(availW, availH, 640);
    if (avail <= 0) return;
    const pad = 4 * 2;      // padding del wrapper
    const gaps = 2 * 14;    // 14 gap da 2px tra 15 celle
    const cell = Math.max(8, Math.floor((avail - pad - gaps) / 15));
    const size = cell * 15 + gaps + pad;
    document.documentElement.style.setProperty('--cell', cell + 'px');
    wrap.style.width = size + 'px';
    wrap.style.height = size + 'px';

    // Spazio verticale che avanza (schermi alti): lo ridistribuisco a fascia punteggio e
    // lettere, senza deformare il tabellone. Il calcolo parte dallo spazio "base" (senza
    // gli extra già applicati) per non entrare in oscillazione.
    const secPad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const baseLeft = sec.clientHeight - secPad - size + fitBoard.xp + fitBoard.xr + fitBoard.xt;
    const spare = Math.max(0, baseLeft - 8);
    const xp = Math.min(Math.round(spare * 0.25), 30);
    const xt = Math.min(Math.round(spare * 0.25), 30);
    const xr = Math.min(Math.round(spare * 0.20), 26);
    fitBoard.xp = xp; fitBoard.xr = xr; fitBoard.xt = xt;
    document.documentElement.style.setProperty('--xp', xp + 'px');
    document.documentElement.style.setProperty('--xr', xr + 'px');
    document.documentElement.style.setProperty('--xt', xt + 'px');
    setTimeout(() => { try { drawOverlays(); } catch (e) {} }, 30);
  }

  // ==================== DIZIONARIO ESTERNO (opzionale) ====================
  // Se nella stessa cartella di questo index.html sono presenti i file
  // "dizionario.txt" e/o "dizionario2.txt" (una parola per riga o separate da
  // spazi), vengono caricati e le loro parole si AGGIUNGONO a quelle di
  // ITALIAN_WORDS_RAW qui sopra (che resta il dizionario di riserva, sempre
  // disponibile offline anche se i file esterni mancano o il dispositivo è
  // offline al primo avvio).

  // dizionario2.txt è pensato apposta per essere un file "di lavoro" che tieni
  // aggiornato tu direttamente nella repository, aggiungendo di volta in volta
  // le parole mancanti in dizionario.txt: ogni file viene scaricato dalla rete
  // ad ogni caricamento della pagina (così le modifiche pubblicate su GitHub
  // sono subito effettive), con la copia in Cache Storage usata solo come
  // riserva se il dispositivo è offline.
  const DICTIONARY_CACHE_NAME = 'scrabble-dizionario-v2';

  async function loadExternalDictionary(url) {
    try {
      let response = null;
      try {
        response = await fetch(url, { cache: 'no-cache' });
        if (response && response.ok && 'caches' in window) {
          const cache = await caches.open(DICTIONARY_CACHE_NAME);
          cache.put(url, response.clone());
        }
      } catch (networkErr) {
        // Offline: prova a recuperare l'ultima copia salvata in cache.
        if ('caches' in window) {
          const cache = await caches.open(DICTIONARY_CACHE_NAME);
          response = await cache.match(url);
        }
      }
      if (!response || !response.ok) return;
      const text = await response.text();
      let added = 0;
      for (const raw of text.split(/\s+/)) {
        const w = raw.trim().toLowerCase();
        // Esclude righe vuote, parole con trattino/apostrofo e abbreviazioni puntate,
        // in linea con le regole di accettazione dello Scrabble ufficiale italiano.
        if (!w || w.includes('-') || w.includes("'") || w.includes('.')) continue;
        if (!ITALIAN_WORDS.has(w)) added++;
        ITALIAN_WORDS.add(w);
      }
      if (added > 0) {
        console.log(`Dizionario esterno "${url}" caricato: +${added} parole (totale: ${ITALIAN_WORDS.size}).`);
      }
    } catch (err) {
      // Nessun file trovato, o offline al primo avvio: si continua
      // tranquillamente con il solo dizionario di base già incluso nel file.
      console.warn(`Dizionario esterno "${url}" non caricato.`, err);
    }

          if (w) BANNED_WORDS.add(w);
        }
      }
      if (BANNED_WORDS.size > 0) console.log(`Parole vietate caricate: ${BANNED_WORDS.size}.`);
    } catch (err) {

  }

  // ---------- vibrazione ----------
  const HAPTIC_KEY = 'scrabbleHaptics';
  function hapticsOn() { try { return localStorage.getItem(HAPTIC_KEY) !== '0'; } catch (e) { return true; } }
  function setHaptics(on) { try { localStorage.setItem(HAPTIC_KEY, on ? '1' : '0'); } catch (e) { /* ignora */ } }
  function haptic(pattern) {
    if (!hapticsOn()) return;

  }
  // Un piccolo "tic" su ogni tocco di pulsanti, righe, tessere e celle.

  // ==================== UTILITY ====================
  function createBag() {
    const newBag = [];
    for (let [letter, count] of Object.entries(LETTER_DISTRIBUTION)) {
      for (let i = 0; i < count; i++) newBag.push(letter);
    }
    shuffleArray(newBag);
    return newBag;
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function updateBagDisplay() {
    if (bagCountEl) bagCountEl.textContent = bag.length;

  // ==================== MODALI (Opzioni / Sacchetto / Come si gioca) ====================
  // ---------- tasto/gesto "indietro" di Android ----------
  function navPush(kind) { try { history.pushState({ k: kind }, ''); } catch (e) { /* ignora */ } }
  function navBack(kind) {
    try {
      if (history.state && history.state.k === kind) { navIgnore++; history.back(); }
    } catch (e) { /* ignora */ }
  }
  window.addEventListener('popstate', () => {
    if (navIgnore > 0) { navIgnore--; return; }
    if (modalPushed) { dismissModal(true); return; }                    // prima si chiude il pannello aperto
    if (gamePushed) { gamePushed = false; mpGoHome(); return; }         // poi si torna alla home
  });

  function resetModalStyles() {
    modalSheet.style.transition = ''; modalSheet.style.transform = '';
    modalOverlay.style.transition = ''; modalOverlay.style.opacity = '';
  }

  // Chiusura immediata (da codice)
  function closeModal() {
    clearTimeout(modalCloseTimer); modalClosing = false;
    mpMenuOpen = false;
    if (modalPushed) { modalPushed = false; navBack('m'); }
    modalOverlay.style.display = 'none';
    modalOverlay.classList.remove('drawer');
    modalOverlay.style.animation = ''; modalSheet.style.animation = '';
    resetModalStyles();
    modalSheet.innerHTML = '';
  }

  // Chiusura "a mano" (tocco fuori, swipe, indietro): il pannello scivola via, lo sfondo si schiarisce
  function dismissModal(fromPop) {
    if (fromPop) modalPushed = false;
    if (modalOverlay.style.display === 'none') return;
    if (modalClosing) return;
    modalClosing = true;
    const drawer = modalOverlay.classList.contains('drawer');
    modalSheet.style.transition = 'transform 0.2s ease';
    modalOverlay.style.transition = 'opacity 0.2s ease';
    modalSheet.style.transform = drawer ? 'translateX(-105%)' : 'translateY(105%)';
    modalOverlay.style.opacity = '0';
    modalCloseTimer = setTimeout(closeModal, 210);
  }

  let modalOpenedAt = 0;
  function openModal(html, opts) {
    clearTimeout(modalCloseTimer); modalClosing = false;
    const drawer = !!(opts && opts.drawer);
    const wasOpen = modalOverlay.style.display === 'flex';
    const sameKind = wasOpen && modalOverlay.classList.contains('drawer') === drawer;
    modalOpenedAt = Date.now();
    resetModalStyles();
    modalOverlay.classList.toggle('drawer', drawer);
    modalSheet.innerHTML = html;
    modalOverlay.style.display = 'flex';
    // se cambia solo il contenuto dello stesso pannello (es. attivo/disattivo una voce) niente nuova animazione
    if (sameKind) { modalSheet.style.animation = 'none'; modalOverlay.style.animation = 'none'; }
    else { modalSheet.style.animation = ''; modalOverlay.style.animation = ''; }
    if (!modalPushed) { modalPushed = true; navPush('m'); }
    const x = modalSheet.querySelector('.modal-x');
    if (x) x.addEventListener('click', dismissModal);
  }

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay && Date.now() - modalOpenedAt > 400) dismissModal();
  });

  // Swipe per chiudere: verso il basso per i pannelli dal basso (opzioni, sacchetto...),
  // verso sinistra per il cassetto della home.
  (function () {
    let g = null;
    modalSheet.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1 || modalClosing) { g = null; return; }
      if (e.target.closest && e.target.closest('.crop-stage, input[type="range"]')) { g = null; return; }
      const t = e.touches[0];
      g = { x: t.clientX, y: t.clientY, t: Date.now(), drag: false, drawer: modalOverlay.classList.contains('drawer') };
    }, { passive: true });
    modalSheet.addEventListener('touchmove', (e) => {
      if (!g) return;
      const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
      if (!g.drag) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        const ok = g.drawer ? (dx < 0 && Math.abs(dx) > Math.abs(dy) * 1.2)
                            : (dy > 0 && Math.abs(dy) > Math.abs(dx) * 1.2 && modalSheet.scrollTop <= 0);
        if (!ok) { g = null; return; }
        g.drag = true; modalSheet.style.transition = 'none';
      }
      if (e.cancelable) e.preventDefault();
      const off = g.drawer ? Math.min(0, dx) : Math.max(0, dy);
      modalSheet.style.transform = g.drawer ? 'translateX(' + off + 'px)' : 'translateY(' + off + 'px)';
      const size = g.drawer ? modalSheet.offsetWidth : modalSheet.offsetHeight;
      modalOverlay.style.opacity = String(Math.max(0.25, 1 - Math.abs(off) / (size * 1.3)));
    }, { passive: false });
    function end(e) {
      if (!g || !g.drag) { g = null; return; }
      const t = e.changedTouches[0];
      const d = g.drawer ? -(t.clientX - g.x) : (t.clientY - g.y);
      const v = d / Math.max(1, Date.now() - g.t);                 // px/ms
      const size = g.drawer ? modalSheet.offsetWidth : modalSheet.offsetHeight;
      g = null;
      if (d > Math.min(110, size * 0.3) || (v > 0.55 && d > 30)) { haptic(8); dismissModal(); }
      else {                                                        // rimbalza al suo posto
        modalSheet.style.transition = 'transform 0.2s ease'; modalOverlay.style.transition = 'opacity 0.2s ease';
        modalSheet.style.transform = ''; modalOverlay.style.opacity = '';
      }
    }
    modalSheet.addEventListener('touchend', end, { passive: true });
    modalSheet.addEventListener('touchcancel', end, { passive: true });
  })();

  function showNotification(msg, duration = 2000) {
    if (/\bnon\b|già|impossibile|manc|invalid|errore|riprova/i.test(String(msg))) haptic([35, 45, 35]);   // avvisi/errori
    notificationEl.textContent = msg;
    notificationEl.classList.add('show');
    clearTimeout(notificationEl._timer);
    notificationEl._timer = setTimeout(() => {
      notificationEl.classList.remove('show');
    }, duration);

  function updateHeaderMessage() {
    syncUI();
  }

  // Aggiorna messaggio in testata + stato pulsanti in base a turno e tessere in sospeso
  function syncUI() {
    saveGameState();

    if (gameOver) {
      skipBtn.disabled = true;
      if (gameMode === 'mp') mpFinishedButton(); else playBtn.disabled = true;
      return;
    }

    if (turn !== 'player') {
      headerMessageEl.textContent = gameMode === 'mp' ? mpWaitingText() : 'CPU sta pensando...';
      playBtn.disabled = true;
      skipBtn.disabled = true;
      return;
    }

    if (swapMode) {
      headerMessageEl.textContent = `Cambio tessere: ${swapSelection.length} selezionate`;
      playBtn.disabled = swapSelection.length === 0;
      skipBtn.disabled = false;
      return;
    }

    skipBtn.disabled = isCpuThinking || pendingTiles.length > 0;

    if (pendingTiles.length === 0) {
      headerMessageEl.textContent = gameMode === 'mp' ? mpYourTurnText() : 'Il tuo turno';
      playBtn.disabled = true;
      return;
    }

    const preview = validateAndScoreMove(pendingTiles);
    if (preview.valid) {
      headerMessageEl.textContent = `${preview.words.join(', ')}: ${preview.score} punti`;
      playBtn.disabled = false;
    } else {
      headerMessageEl.textContent = preview.error === 'Nessuna parola valida'
        ? 'Le parole devono essere formate da almeno 2 lettere.'
        : preview.error || 'Componi una parola valida...';
      playBtn.disabled = true;
    }
  }

  // Accende il profilo di chi sta giocando e spegne l'altro.
  // A partita finita restano accesi il vincitore (o entrambi in caso di pareggio).
  function updateTurnIndicator() {
    let playerOn = false, cpuOn = false;
    if (gameOver && gameMode === 'mp' && mp.game) {
      const w = mp.game.winnerUid;             // in caso di resa vince chi non si è arreso, a prescindere dai punti
      playerOn = !w || w === mp.uid;
      cpuOn = !w || w !== mp.uid;
    } else if (gameOver) {
      playerOn = playerScore >= cpuScore;
      cpuOn = cpuScore >= playerScore;
    } else if (turn === 'player') {
      playerOn = true;
    } else if (turn === 'cpu' || turn === 'opponent') {
      cpuOn = true;
    }
    playerCardEl.classList.toggle('active', playerOn);
    cpuCardEl.classList.toggle('active', cpuOn);
  }

  // ==================== RENDER ====================
  function renderBoard() {
    boardEl.innerHTML = '';

    for (let r = 0; r < BOARD_SIZE; r++) {
      for (let c = 0; c < BOARD_SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        const premium = PREMIUM_LAYOUT[r][c];
        
        if (premium === 1) cell.classList.add('dl');
        else if (premium === 2) cell.classList.add('tl');
        else if (premium === 3) cell.classList.add('dw');
        else if (premium === 4) cell.classList.add('tw');
        else if (premium === 5) cell.classList.add('star');

        const pending = pendingTiles.find(t => t.row === r && t.col === c);

        // Se c'è una lettera confermata (turni precedenti)
        if (board[r][c]) {
          cell.textContent = board[r][c];
          cell.classList.add('occupied');
          if (lastMove && lastMove.cells && lastMove.cells.some(([lr, lc]) => lr === r && lc === c)) {
            cell.classList.add(lastMove.mine ? 'last-mine' : 'last-opp');
          }
          const pts = LETTER_VALUES[board[r][c]] || 0;
          const ptsSpan = document.createElement('span');
          ptsSpan.className = 'tile-points';
          ptsSpan.textContent = pts;
          cell.appendChild(ptsSpan);
        } else if (pending) {
          // Lettera piazzata in questo turno, non ancora confermata
          cell.textContent = pending.letter;
          cell.classList.add('pending');
          if (popKey === r + ',' + c) cell.classList.add('pop');
          const pts = LETTER_VALUES[pending.letter] || 0;
          const ptsSpan = document.createElement('span');
          ptsSpan.className = 'tile-points';
          ptsSpan.textContent = pts;
          cell.appendChild(ptsSpan);

          attachBoardTileDrag(cell, r, c);
        } else {
          // Altrimenti mostra l'etichetta premium
          if (premium > 0) {
            const label = document.createElement('span');
            label.className = 'premium-label';
            label.textContent = PREMIUM_LABELS[premium];
            cell.appendChild(label);
          }
        }

        cell.addEventListener('click', () => handleCellClick(r, c));
        boardEl.appendChild(cell);
      }
    }
    popKey = null;
    drawOverlays();
  }

  function renderRack() {
    rackSlotsEl.innerHTML = '';
    for (let i = 0; i < 7; i++) {
      const slot = document.createElement('div');
      slot.className = 'rack-slot';
      
      if (i < playerRack.length) {
        const letter = playerRack[i];
        slot.classList.add('filled');
        if (selectedTileIndex === i) slot.classList.add('selected-tile');
        if (swapMode && swapSelection.includes(i)) slot.classList.add('marked-swap');
        
        const letterSpan = document.createElement('span');
        letterSpan.className = 'rack-letter';
        letterSpan.textContent = letter;
        slot.appendChild(letterSpan);
        
        const ptsSpan = document.createElement('span');
        ptsSpan.className = 'rack-points';
        ptsSpan.textContent = LETTER_VALUES[letter] || 0;
        slot.appendChild(ptsSpan);
        
        attachRackDrag(slot, i);
      }
      
      rackSlotsEl.appendChild(slot);
    }
  }
